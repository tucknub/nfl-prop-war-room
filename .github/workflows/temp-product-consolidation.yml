name: PropWar consolidation phase 1
# rerun after formatting-safe product assertions

on:
  push:
    paths:
      - ".github/workflows/temp-product-consolidation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed product surfaces
        run: |
          python -m py_compile dashboard/app.py
          python -m py_compile dashboard/pages/09_Glitch_Radar.py
          python -m py_compile dashboard/pages/10_Deep_Prop_Radar.py
      - name: Run consolidation and public contracts
        run: |
          pytest -q             tests/test_product_consolidation.py             tests/test_dashboard_app_import_path.py             tests/test_public_role_research_language.py             tests/test_glitch_radar_why_now.py             tests/test_glitch_radar_history.py             tests/test_glitch_radar_present.py             tests/test_glitch_radar_books.py
      - name: Streamlit homepage startup from production-like cwd
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          app = root / "dashboard" / "app.py"
          os.chdir("/tmp")
          at = AppTest.from_file(str(app))
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Homepage startup ok from /tmp")
          PY
