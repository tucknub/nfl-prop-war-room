name: Margin Research V1

on:
  push:
    branches: [margin-research-v1]
    paths:
      - 'research/margin_v1/run_live_margin_2026.py'
      - 'research/margin_v1/run_live_margin_replay_validation.py'
      - 'research/margin_v1/run_margin_style_strategy.py'
      - 'research/margin_v1/run_margin_future_lines.py'
      - 'research/margin_v1/run_margin_team_style.py'
      - 'research/margin_v1/run_margin_dashboard_smoke.py'
      - 'research/margin_v1/live_state_2026.json'
      - 'dashboard/app.py'
      - 'dashboard/pages/07_Margin_War_Room.py'
      - '.github/workflows/margin-research-v1.yml'
  pull_request:
    branches: [streamlit-cloud-deploy]
    paths:
      - 'research/margin_v1/run_live_margin_2026.py'
      - 'research/margin_v1/run_live_margin_replay_validation.py'
      - 'research/margin_v1/run_margin_style_strategy.py'
      - 'research/margin_v1/run_margin_future_lines.py'
      - 'research/margin_v1/run_margin_team_style.py'
      - 'research/margin_v1/run_margin_dashboard_smoke.py'
      - 'research/margin_v1/live_state_2026.json'
      - 'dashboard/app.py'
      - 'dashboard/pages/07_Margin_War_Room.py'
      - '.github/workflows/margin-research-v1.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn nflreadpy streamlit
      - name: Run end-to-end style-aware allocation gate
        run: python research/margin_v1/run_margin_style_strategy.py
      - name: Run reusable live Margin 2026 engine
        run: python research/margin_v1/run_live_margin_2026.py
      - name: Replay 2021-2025 and assert live-engine invariants
        run: python research/margin_v1/run_live_margin_replay_validation.py
      - name: Compile Margin dashboard files
        run: python -m py_compile dashboard/app.py dashboard/pages/07_Margin_War_Room.py
      - name: Render Margin dashboard smoke test
        run: python research/margin_v1/run_margin_dashboard_smoke.py
