name: Diagnostic clean build

on:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify runtime
        run: |
          python - <<'PY'
          import streamlit as st
          print("streamlit", st.__version__)
          from src.fantasy.free_agents import FANTASY_POSITIONS, build_live_free_agent_pool, filter_live_free_agents
          print("free_agents import ok", FANTASY_POSITIONS)
          PY
      - name: AppTest startup
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/pages/11_Fantasy_HQ.py")
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Fantasy HQ AppTest startup ok")
          PY
