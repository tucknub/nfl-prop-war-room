name: Apply Operational Readiness Bundle

on:
  push:
    branches:
      - propwar-2026-operational-readiness
    paths:
      - ".ops/apply"
  pull_request:
    branches:
      - streamlit-cloud-deploy
    paths:
      - ".ops/apply"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: propwar-2026-operational-readiness
          fetch-depth: 0

      - name: Apply audited source bundle
        run: |
          set -euo pipefail
          test -f .ops/apply
          parts=(.ops/operational_readiness_bundle.tar.gz.b64.part-*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" > /tmp/operational_readiness_bundle.tar.gz.b64
          base64 --decode /tmp/operational_readiness_bundle.tar.gz.b64 > /tmp/operational_readiness_bundle.tar.gz
          echo "622d7f31bbac9679cd2b85cd578bf808e1da53545a67550bea0531535bbd28e4  /tmp/operational_readiness_bundle.tar.gz" | sha256sum --check
          tar -xzf /tmp/operational_readiness_bundle.tar.gz
          rm -rf .ops
          rm -f .github/workflows/role-research-operations.yml

      - name: Commit atomic source update
        run: |
          git config user.name "propwar-operations"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build 2026 current-season role operations"
          git push origin HEAD:propwar-2026-operational-readiness
