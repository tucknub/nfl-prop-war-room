name: Fantasy HQ Live QA Targeted

on:
  push:
    branches:
      - fantasy-hq-live-qa-hardening

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run targeted Fantasy HQ regressions
        run: |
          pytest -vv             tests/test_fantasy_sleeper_current.py             tests/test_fantasy_team_explorer.py             tests/test_fantasy_league_needs.py             tests/test_fantasy_free_agents.py             tests/test_fantasy_action_feed.py             tests/test_fantasy_live_qa_regressions.py
