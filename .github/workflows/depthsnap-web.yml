name: DepthSnap Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/depthsnap/**"
      - "docs/propwar/NEXTJS_PUBLIC_APP_MIGRATION.md"
      - ".github/workflows/depthsnap-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run browser verification
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: depthsnap-browser-evidence
          path: |
            apps/web/artifacts/screenshots
            apps/web/artifacts/playwright-report
            apps/web/artifacts/test-results
          if-no-files-found: warn
