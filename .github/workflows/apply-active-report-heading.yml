name: Apply Active Report Heading Fix

on:
  pull_request:
    paths:
      - ".github/workflows/apply-active-report-heading.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: propwar-2026-operational-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Restore active report heading and guard
        run: |
          python - <<'PY'
          from pathlib import Path

          reports = Path('dashboard/pages/04_Reports.py')
          text = reports.read_text(encoding='utf-8')
          old = '''if selected_report is None:\n    selected_report = REPORT_ORDER[0]\nst.caption(REPORT_DEFINITIONS[selected_report])\n'''
          new = '''if selected_report is None:\n    selected_report = REPORT_ORDER[0]\nst.markdown(f"## {selected_report}")\nst.caption(REPORT_DEFINITIONS[selected_report])\n'''
          if old not in text:
              raise SystemExit('active report heading insertion point not found')
          reports.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_three_report_launch.py')
          source = tests.read_text(encoding='utf-8')
          guard = '    assert \'st.markdown(f"## {selected_report}")\' in source\n'
          anchor = '    assert "ALL_PLAY_AUTHORITY_NOTICE" in source\n'
          if guard not in source:
              if anchor not in source:
                  raise SystemExit('report launch test anchor not found')
              source = source.replace(anchor, anchor + guard, 1)
              tests.write_text(source, encoding='utf-8')
          PY

      - name: Verify targeted launch test
        run: python -m pytest -q tests/test_three_report_launch.py

      - name: Commit presentation fix
        run: |
          git config user.name "propwar-operations"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/pages/04_Reports.py tests/test_three_report_launch.py
          git commit -m "Restore visible active report heading"
          git push origin HEAD:propwar-2026-operational-readiness
