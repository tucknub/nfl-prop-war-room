category_adjudications:
  - id: "decrease_current_opportunity_is_signal_not_independent_noise"
    action: "reclassify_decrease_current_opportunity"
    reviewed_case_count: 61
    rationale: >-
      A low current opportunity count is the detected event for a decrease alert, so
      it cannot independently explain that alert as opportunity-count noise. After
      manual review, use the next observed evidence code in the declared precedence;
      otherwise retain role reversion with no observed data issue.
    fallback_priority:
      - LOW_TEAM_DENOMINATOR_NOISE
      - BASELINE_SMALL_OR_UNSTABLE
      - MARGINAL_CHANGE_NEAR_THRESHOLD
      - NORMAL_CONTEXT_SENSITIVE
  - id: "teammate_exit_is_context_not_proven_beneficiary_cause"
    action: "rename_suspected_teammate_context"
    reviewed_case_count: 5
    rationale: >-
      The teammate exit is suspected rather than confirmed and includes decrease as
      well as increase alerts. Preserve it as observed context without claiming a
      causal beneficiary mechanism.

