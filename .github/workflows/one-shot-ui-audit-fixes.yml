name: One-shot UI audit fixes

on:
  push:
    branches:
      - fix/knockout-waiver-sync-audit
    paths:
      - .github/workflows/one-shot-ui-audit-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/knockout-waiver-sync-audit
          fetch-depth: 0
      - name: Patch dynamic anchors
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker missing in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "dashboard/research_ui.py",
              "from html import escape\nfrom typing import Iterable\n",
              "from html import escape\nimport re\nfrom typing import Iterable\n",
          )
          replace_once(
              "dashboard/research_ui.py",
              'PUBLIC_SOURCE_NOTE = "Regular-season role and opportunity data; current-season weeks appear only after validation."\n\n\ndef percent',
              '''PUBLIC_SOURCE_NOTE = "Regular-season role and opportunity data; current-season weeks appear only after validation."\n\n\ndef heading_slug(text: object) -> str:\n    slug = re.sub(r"[^a-z0-9]+", "-", str(text or "").casefold()).strip("-")\n    return slug or "section"\n\n\ndef anchored_heading(text: object, *, level: int = 2) -> None:\n    safe_level = min(6, max(1, int(level)))\n    anchor_id = heading_slug(text)\n    st.markdown(\n        f'<h{safe_level} id="{escape(anchor_id)}">{escape(str(text))}</h{safe_level}>',\n        unsafe_allow_html=True,\n    )\n\n\ndef percent''',
          )
          replace_once(
              "dashboard/research_ui.py",
              '''def section(title: str, subtitle: str = "") -> None:\n    st.markdown(\n        f'<div class="pw-section"><h2>{escape(title)}</h2><span>{escape(subtitle)}</span></div>',\n        unsafe_allow_html=True,\n    )\n''',
              '''def section(title: str, subtitle: str = "") -> None:\n    anchor_id = heading_slug(title)\n    st.markdown(\n        f'<div class="pw-section"><h2 id="{escape(anchor_id)}">{escape(title)}</h2><span>{escape(subtitle)}</span></div>',\n        unsafe_allow_html=True,\n    )\n''',
          )
          replace_once(
              "dashboard/pages/04_Reports.py",
              "from research_ui import (\n    methodology_expander,\n",
              "from research_ui import (\n    anchored_heading,\n    methodology_expander,\n",
          )
          replace_once(
              "dashboard/pages/04_Reports.py",
              '''            st.markdown(\n                f"### {rank}. {row['player_name']}"\n            )\n''',
              '''            anchored_heading(f"{rank}. {row['player_name']}", level=3)\n''',
          )
          replace_once(
              "dashboard/pages/04_Reports.py",
              'st.markdown(f"## {selected_report}")\n',
              'anchored_heading(str(selected_report), level=2)\n',
          )
      - name: Verify source contract
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, "dashboard")
          from research_ui import heading_slug
          assert heading_slug("Target Hierarchy") == "target-hierarchy"
          assert heading_slug("1. Jaxon Smith-Njigba") == "1-jaxon-smith-njigba"
          assert heading_slug("CLE leading roles") == "cle-leading-roles"
          reports = Path("dashboard/pages/04_Reports.py").read_text(encoding="utf-8")
          assert 'anchored_heading(str(selected_report), level=2)' in reports
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/one-shot-ui-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard .github/workflows/one-shot-ui-audit-fixes.yml
          git commit -m "Fix stale dynamic page anchors"
          git push origin HEAD:fix/knockout-waiver-sync-audit
