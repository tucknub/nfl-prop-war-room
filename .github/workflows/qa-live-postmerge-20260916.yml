name: Diagnose Live Mobile Expanders 2026-09-16

on:
  push:
    branches:
      - qa/live-postmerge-20260916
    paths:
      - .github/workflows/qa-live-postmerge-20260916.yml

permissions:
  contents: read

jobs:
  diagnose-mobile-expanders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: streamlit-cloud-deploy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose reports and games expanders
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          base = os.environ['PROPWAR_LIVE_URL'].rstrip('/')
          cases = [
              ('reports', 'Customize report'),
              ('games', 'Change game'),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for route, label in cases:
                  context = browser.new_context(
                      viewport={'width': 390, 'height': 844},
                      device_scale_factor=3,
                      is_mobile=True,
                      has_touch=True,
                  )
                  page = context.new_page()
                  page.goto(f'{base}/{route}', wait_until='domcontentloaded', timeout=120_000)
                  page.wait_for_timeout(7_000)
                  print(f'=== /{route} ===')
                  found = False
                  for index, frame in enumerate(page.frames):
                      try:
                          expanders = frame.locator('[data-testid="stExpander"]').filter(has_text=label)
                          count = expanders.count()
                      except Exception as exc:
                          print('frame_error', index, frame.url, repr(exc))
                          continue
                      print('frame', index, frame.url, 'matching_expanders', count)
                      if not count:
                          continue
                      found = True
                      expander = expanders.first
                      summary = expander.locator('summary').first
                      print('before_text=', repr(expander.inner_text(timeout=10_000)))
                      print('before_open=', expander.locator('details').first.get_attribute('open') if expander.locator('details').count() else 'no-details-child')
                      print('summary_visible=', summary.is_visible() if summary.count() else False)
                      if summary.count():
                          summary.click(timeout=10_000)
                          page.wait_for_timeout(3_000)
                      print('after_text=', repr(expander.inner_text(timeout=10_000)))
                      print('after_html=', expander.inner_html(timeout=10_000)[:12000])
                      body = frame.locator('body').inner_text(timeout=10_000)
                      print('body_has_Season=', 'Season' in body)
                      print('body_has_Time_period=', 'Time period' in body)
                      print('body_has_Search_or_select_game=', 'Search or select game' in body)
                      page.screenshot(path=f'/tmp/{route}_after_click.png', full_page=True)
                      break
                  print('found=', found)
                  context.close()
              browser.close()
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-expander-diagnostics-20260916
          path: /tmp/*_after_click.png
          if-no-files-found: warn
