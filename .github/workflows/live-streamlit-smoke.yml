name: PropWar Live Streamlit Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propwar-live-streamlit-smoke-manual
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: streamlit-cloud-deploy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify deployed PropWar public and auth-safe surfaces
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit.py

      - name: Verify deployed PropWar mobile surfaces and controls
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit_mobile.py

      - name: Upload live QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: propwar-live-streamlit-qa
          path: /tmp/propwar-live-qa
          if-no-files-found: warn
