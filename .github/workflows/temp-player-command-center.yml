name: Player Command Center validation
# final rerun after event-scoped signal hardening

on:
  push:
    paths:
      - ".github/workflows/temp-player-command-center.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed modules
        run: |
          python -m py_compile src/fantasy/identity.py
          python -m py_compile dashboard/player_command_center.py
          python -m py_compile dashboard/pages/02_Players.py
      - name: Run command-center and regression tests
        run: |
          pytest -q             tests/test_player_command_center.py             tests/test_fantasy_identity.py             tests/test_fantasy_player_intelligence.py             tests/test_fantasy_player_market.py             tests/test_glitch_radar_props.py             tests/test_glitch_radar_line_shop.py             tests/test_role_change_detector.py             tests/test_role_research.py             tests/test_public_role_research_language.py
      - name: Streamlit Players startup
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          sys.path.insert(0, str(root / "dashboard"))
          sys.path.insert(0, str(root))

          at = AppTest.from_file("dashboard/pages/02_Players.py")
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Players startup ok")
          PY
