name: App import hotfix validation

on:
  push:
    paths:
      - ".github/workflows/temp-app-import-hotfix.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile app and owner module
        run: |
          python -m py_compile dashboard/app.py
          python -m py_compile dashboard/propwar_today_owner.py
      - name: Reproduce production import context
        run: |
          pytest -q tests/test_dashboard_app_import_path.py
      - name: Streamlit homepage startup without injected repo path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          app = root / "dashboard" / "app.py"
          os.chdir("/tmp")
          at = AppTest.from_file(str(app))
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Homepage startup ok from /tmp")
          PY
