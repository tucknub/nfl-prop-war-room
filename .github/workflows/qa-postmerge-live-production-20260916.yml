name: Post-merge live production audit 2026-09-16

on:
  push:
    branches:
      - fix/full-audit-2026-test-contracts
    paths:
      - ".github/workflows/qa-postmerge-live-production-20260916.yml"

permissions:
  contents: read

jobs:
  live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out deployed production branch
        uses: actions/checkout@v7
        with:
          ref: streamlit-cloud-deploy

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify deployed public and auth-safe surfaces
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit.py

      - name: Verify deployed mobile surfaces and controls
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit_mobile.py

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postmerge-live-production-audit
          path: /tmp/propwar-live-qa
          if-no-files-found: warn
