name: Three Report MVP

on:
  push:
    branches:
      - propwar-three-report-launch-mvp
  pull_request:
    paths:
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/three-report-mvp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile changed application files
        run: |
          python -m py_compile \
            dashboard/app.py \
            dashboard/launch_contract.py \
            dashboard/pages/04_Reports.py \
            dashboard/pages/06_Methodology.py \
            tests/test_three_report_launch.py

      - name: Run repository tests
        run: pytest -q
