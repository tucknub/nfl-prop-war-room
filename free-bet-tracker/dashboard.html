<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5cae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Free Bets">
<title>Free Bet Tracker</title>
<style>
:root{--bg:#f7f7fa;--surface:#fff;--text:#17171c;--muted:#73737f;--border:#e5e5ec;--purple:#6d5cae;--purpleSoft:#f3f0f8;--red:#f4cccc;--redText:#7c2020;--orange:#fce5cd;--orangeText:#7b4a1f;--shadow:0 8px 24px rgba(32,31,39,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100svh}.app{max-width:560px;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px}.top h1{margin:0;font-size:27px;line-height:1;font-weight:850;letter-spacing:-.04em}.top p{margin:7px 0 0;color:var(--muted);font-size:13px}.refresh{border:0;background:var(--purpleSoft);color:var(--purple);width:42px;height:42px;border-radius:14px;font-size:21px;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;margin-bottom:10px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:15px 14px;box-shadow:0 4px 14px rgba(20,20,30,.035)}.label{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.num{font-size:27px;font-weight:900;letter-spacing:-.04em;margin-top:5px}.danger .num{color:#a13c30}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin:0 2px 18px;line-height:1.45}.estimate{color:#8b651f}.updated{white-space:nowrap}.updated.stale{color:#9a641f;font-weight:750}.updated.old,.offline{color:#a13c30;font-weight:800}.section{font-size:15px;font-weight:850;margin:0 2px 10px}.list{display:flex;flex-direction:column;gap:10px}details.card{background:var(--surface);border:1px solid var(--border);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}details.card.urgent{border-color:#efb7b7;background:linear-gradient(180deg,#fff 0%,#fff 56%,var(--red) 170%)}details.card.soon{border-color:#f0d3b9;background:linear-gradient(180deg,#fff 0%,#fff 58%,var(--orange) 175%)}summary{list-style:none;cursor:pointer;padding:15px;outline:none}summary::-webkit-details-marker{display:none}summary:focus-visible{box-shadow:inset 0 0 0 3px rgba(109,92,174,.16)}.row{display:flex;gap:12px;align-items:flex-start}.mark{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--purpleSoft);color:var(--purple);display:grid;place-items:center;font-size:14px;font-weight:900}.main{min-width:0;flex:1}.bookline{display:flex;align-items:center;gap:8px}.book{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{margin-left:auto;font-size:20px;font-weight:900;letter-spacing:-.025em;white-space:nowrap}.promo{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid rgba(100,100,110,.14);margin-top:13px;padding-top:11px}.count{font-size:14px;font-weight:850}.urgent .count{color:var(--redText)}.soon .count{color:var(--orangeText)}.exact{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badges{display:flex;align-items:center;gap:7px}.pill{font-size:10px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;color:var(--purple);background:var(--purpleSoft);padding:6px 8px;border-radius:9px}.pill.est{color:#76521f;background:#fff1db}.chev{color:var(--muted);font-size:17px;line-height:1;transition:transform .16s ease}details[open] .chev{transform:rotate(180deg)}.details{border-top:1px solid rgba(100,100,110,.14);padding:12px 15px 15px;color:#555561;font-size:12px;line-height:1.5}.detailLabel{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850;margin-bottom:4px}.tapHint{margin-top:7px;font-size:11px;color:var(--purple);font-weight:750}.empty{background:#fff;border:1px dashed #d7d7df;border-radius:20px;padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin:20px 24px 0}@media(min-width:700px){.app{padding-top:28px}.top h1{font-size:31px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Free Bet Tracker</h1><p>Your promo wallet, ordered by urgency.</p></div><button class="refresh" id="refresh" aria-label="Refresh">↻</button></header>
<section class="summary"><div class="stat"><div class="label">Bonus bet money</div><div class="num" id="money">$0</div></div><div class="stat danger"><div class="label">Under 24h</div><div class="num" id="urgent">0</div></div></section>
<div class="meta"><span><span id="active">0 active</span><span id="estimated" class="estimate"></span></span><span id="updated" class="updated">Loading…</span></div>
<h2 class="section">Expiring next</h2><section class="list" id="list"></section>
<p class="note">Tap any promo to reveal terms and notes. Send new screenshots to ChatGPT and I’ll keep this current.</p>
</main>
<script>
const DATA_URL='https://raw.githubusercontent.com/tucknub/nfl-prop-war-room/streamlit-cloud-deploy/free-bet-tracker/promos.json';
const $=s=>document.querySelector(s),list=$('#list');let promos=[],dataUpdatedAt=null;
function hrs(x){return(new Date(x).getTime()-Date.now())/36e5}function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0)}function exact(x){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x))}function updatedText(x){return 'Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x)).replace(',',' ·')}function left(h){if(h<1)return Math.max(1,Math.round(h*60))+'m left';if(h<48)return h.toFixed(h<10?1:0)+'h left';return Math.ceil(h/24)+'d left'}function cls(h){return h<24?'urgent':h<48?'soon':''}function initials(s){return s.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function hero(p){if(p.value>0)return money(p.value);const m=p.promo.match(/\b\d+%/);if(m)return m[0];if(p.kind==='no_sweat')return'No Sweat';if(p.kind==='qualifier')return'Earn $10';return'Promo'}function kind(p){return p.kind==='bonus'?'Bonus Bet':p.kind==='no_sweat'?'No Sweat':p.kind==='qualifier'?'Bet & Get':'Boost'}
function freshness(){const el=$('#updated');if(!dataUpdatedAt)return;const age=(Date.now()-new Date(dataUpdatedAt).getTime())/36e5;el.className='updated';if(age>=24)el.classList.add('old');else if(age>=12)el.classList.add('stale');el.textContent=updatedText(dataUpdatedAt)}
function render(){const active=promos.filter(p=>hrs(p.expires)>=0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));$('#money').textContent=money(active.filter(p=>p.kind==='bonus').reduce((s,p)=>s+Number(p.value||0),0));$('#urgent').textContent=active.filter(p=>hrs(p.expires)<24).length;$('#active').textContent=active.length+' active';const est=active.filter(p=>p.estimated).length;$('#estimated').textContent=est?' · '+est+' estimated'+(est===1?'':'')+' expirations':'';if(!active.length){list.innerHTML='<div class="empty"><strong>Nothing waiting</strong>No active promos are currently tracked.</div>';freshness();return}list.innerHTML=active.map(p=>{const h=hrs(p.expires);return `<details class="card ${cls(h)}"><summary><div class="row"><div class="mark">${initials(p.book)}</div><div class="main"><div class="bookline"><div class="book">${esc(p.book)}</div><div class="hero">${esc(hero(p))}</div></div><div class="promo">${esc(p.promo)}</div><div class="tapHint">Tap for terms</div></div></div><div class="foot"><div><span class="count">${left(h)}</span><span class="exact">Expires ${exact(p.expires)}</span></div><span class="badges"><span class="pill ${p.estimated?'est':''}">${p.estimated?'Est.':kind(p)}</span><span class="chev">⌄</span></span></div></summary><div class="details"><div class="detailLabel">Terms / notes</div><div>${esc(p.notes||'No extra terms captured.')}</div></div></details>`}).join('');freshness()}
async function getJson(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('load');return r.json()}
async function load(){try{let d;try{d=await getJson(DATA_URL)}catch{d=await getJson('./promos.json')}promos=Array.isArray(d.promos)?d.promos:[];dataUpdatedAt=d.updatedAt||null;render()}catch{$('#updated').textContent='Refresh failed';$('#updated').className='updated offline'}}
$('#refresh').onclick=load;load();setInterval(load,60000);setInterval(()=>{render();freshness()},15000);
</script>
</body>
</html>
