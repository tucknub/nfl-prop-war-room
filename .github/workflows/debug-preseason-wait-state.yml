name: Apply Wait State Test Import Fix

on:
  pull_request:
    paths:
      - ".github/workflows/debug-preseason-wait-state.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-2026-preseason-wait-state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Add top-level json import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_current_role_operations.py')
          text = path.read_text(encoding='utf-8')
          target = 'from dataclasses import replace\nfrom pathlib import Path\n'
          replacement = 'from dataclasses import replace\nimport json\nfrom pathlib import Path\n'
          if replacement not in text:
              if target not in text:
                  raise SystemExit('top-level import target not found')
              text = text.replace(target, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify regression and operations tests
        run: |
          python -m pytest -q tests/test_current_role_operations.py::test_completion_gate_waits_when_no_game_is_complete
          python -m pytest -q tests/test_current_role_operations.py

      - name: Commit test harness fix
        run: |
          git config user.name "propwar-operations"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_current_role_operations.py
          git commit -m "Fix wait-state regression test import"
          git push origin HEAD:fix-2026-preseason-wait-state
