name: Margin Research Temporary Runner

on:
  pull_request:
    branches: [streamlit-cloud-deploy]
    paths:
      - 'research/margin_v1/**'
      - '.github/workflows/role-research-operations.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy
      - name: Run 2006-2025 Margin Pool research
        run: python research/margin_v1/run_margin_research.py
      - name: Run rolling-strategy sensitivity checks
        run: python research/margin_v1/run_margin_sensitivity.py
      - name: Run static-allocation and failure diagnostics
        run: python research/margin_v1/run_margin_static_diagnostics.py
