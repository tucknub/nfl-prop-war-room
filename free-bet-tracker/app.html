function render(){const open=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.id)),active=promos.filter(p=>msLeft(p.expires)>0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));rail(active);renderPriority(active);$('#money').textContent=money(active.filter(p=>p.kind==='bonus').reduce((s,p)=>s+Number(p.value||0),0));$('#urgent').textContent=active.filter(p=>msLeft(p.expires)<=24*60*60e3).length;$('#active').textContent=active.length+' active';const est=active.filter(p=>p.estimated).length;$('#estimated').textContent=est?' · '+est+' estimated time'+(est===1?'':'s'):'';if(!active.length){list.innerHTML='<div class="empty"><strong>Nothing waiting</strong>No active promos are currently tracked.</div>';freshness();return}list.innerHTML=active.map((p,i)=>{const ms=msLeft(p.expires),st=state(ms),l=LOGOS[p.book]||{brand:'#7358bd'},isOpen=open.has(p.id);return`<details class="card ${st}" data-id="${esc(p.id)}" style="--brand:${l.brand}" ${isOpen?'open':''}><span class="firstFlag">Use first</span><span class="hourFlag">${st==='critical'?'Expiring now':'Final hour'}</span><summary><div class="cardTop">${logoTile(p.book)}<div class="main"><div class="bookline"><div class="book">${esc(p.book)}</div><div class="heroValue">${esc(hero(p))}</div></div><div class="promo">${esc(p.promo)}</div><div class="typeLine"><span class="typeIcon">${ICONS[p.kind]||'•'}</span><span class="tapHint">${kind(p)} · Tap for terms</span></div></div></div><div class="foot"><div><span class="count" data-exp="${esc(p.expires)}">${timer(ms)}</span><span class="exact">Expires ${exact(p.expires)}</span></div><span class="badges"><span class="pill ${p.estimated?'est':''}">${p.estimated?'Estimated time':'Exact time'}</span><span class="chev">⌄</span></span></div></summary><div class="progress"><span style="width:${progress(ms)}%"></span></div><div class="details"><div class="detailLabel">Terms / notes</div><div>${esc(p.notes||'No extra terms captured.')}</div></div></details>`}).join('');const first=list.querySelector('details');if(first)first.classList.add('first');freshness()}
function tick(){document.querySelectorAll('.count[data-exp]').forEach(el=>{const ms=msLeft(el.dataset.exp);el.textContent=timer(ms);const card=el.closest('.card'),st=state(ms);card.classList.remove('critical','finalHour','urgent','soon');if(st)card.classList.add(st);const flag=card.querySelector('.hourFlag');if(flag)flag.textContent=st==='critical'?'Expiring now':'Final hour';const bar=card.querySelector('.progress span');if(bar)bar.style.width=progress(ms)+'%'});$('#localClock').textContent=currentTime();const active=promos.filter(p=>msLeft(p.expires)>0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));renderPriority(active);const p=active[0];document.title=p&&msLeft(p.expires)<=60*60e3?timer(msLeft(p.expires))+' · '+p.book+' · Free Bet Tracker':'Free Bet Tracker'}
async function getJson(src){const r=await fetch(src.url+(src.url.includes('?')?'&':'?')+'ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(src.name);const d=await r.json();if(!d||!Array.isArray(d.promos))throw Error(src.name);return{name:src.name,live:true,data:d}}function stamp(d){const n=new Date(d?.updatedAt||0).getTime();return Number.isFinite(n)?n:0}async function load(){const candidates=[{name:'bundled',live:false,data:BUNDLED}];try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&Array.isArray(c.promos))candidates.push({name:'saved',live:false,data:c})}catch{}const settled=await Promise.allSettled(LIVE.map(getJson));settled.forEach(r=>{if(r.status==='fulfilled')candidates.push(r.value)});candidates.sort((a,b)=>stamp(b.data)-stamp(a.data)||Number(b.live)-Number(a.live));const best=candidates[0];promos=best.data.promos;dataUpdatedAt=best.data.updatedAt||null;dataMode=best.live?'live':'snapshot';localStorage.setItem(CACHE_KEY,JSON.stringify(best.data));const liveOk=candidates.some(x=>x.live),strip=$('#strip');if(liveOk){strip.className='strip';strip.textContent=''}else{strip.className='strip show';strip.textContent='Live refresh is unavailable right now. Showing the complete saved promo snapshot instead.'}render()}
$('#refresh').onclick=load;load();tick();setInterval(tick,1000);setInterval(load,300000);
</script></body></html>
