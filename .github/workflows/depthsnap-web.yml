name: DepthSnap Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/propwar/NEXTJS_PUBLIC_APP_MIGRATION.md"
      - ".github/workflows/depthsnap-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
