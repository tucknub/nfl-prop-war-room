name: Fantasy player search validation

on:
  push:
    paths:
      - ".github/workflows/temp-fantasy-player-search.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Fantasy HQ
        run: python -m py_compile dashboard/pages/11_Fantasy_HQ.py
      - name: Search tests
        run: pytest -q tests/test_fantasy_search_performance.py
      - name: Streamlit AppTest startup
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/pages/11_Fantasy_HQ.py")
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Fantasy HQ AppTest startup ok")
          PY
