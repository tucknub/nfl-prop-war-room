name: Margin Research V1

on:
  push:
    branches: [margin-research-v1]
    paths:
      - 'research/margin_v1/run_margin_style_strategy.py'
      - '.github/workflows/margin-research-v1.yml'
  pull_request:
    branches: [streamlit-cloud-deploy]
    paths:
      - 'research/margin_v1/run_margin_style_strategy.py'
      - '.github/workflows/margin-research-v1.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn nflreadpy
      - name: Run end-to-end style-aware Margin strategy research
        run: python research/margin_v1/run_margin_style_strategy.py
