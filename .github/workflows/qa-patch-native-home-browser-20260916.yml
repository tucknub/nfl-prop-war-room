name: One-shot native Home browser QA patch

on:
  push:
    branches:
      - fix/full-audit-2026-test-contracts
    paths:
      - ".github/workflows/qa-patch-native-home-browser-20260916.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-audit-2026-test-contracts

      - name: Align browser QA with native Streamlit navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_three_report_launch_browser_qa.py")
          source = path.read_text(encoding="utf-8")
          old = '''    check("View Backfield Control" in home_text, f"{name}: Home missing direct report CTA", failures)\n    home_cta = first_visible(page.get_by_role("link", name="View Backfield Control", exact=True))\n    home_href = home_cta.get_attribute("href") if home_cta is not None else None\n    check(\n        validate_report_href(home_href, "Backfield Control"),\n        f"{name}: invalid direct report link: {home_href}",\n        failures,\n    )\n'''
          new = '''    check("View Backfield Control" in home_text, f"{name}: Home missing direct report CTA", failures)\n    home_cta = first_visible(page.get_by_role("button", name="View Backfield Control", exact=True))\n    check(home_cta is not None, f"{name}: native Backfield Control CTA is not visible", failures)\n    if home_cta is not None:\n        home_cta.click()\n        page.get_by_role("heading", name=REPORT_HEADING, exact=True).wait_for(timeout=90000)\n        page.wait_for_timeout(800)\n        check(\n            validate_report_href(page.url, "Backfield Control"),\n            f"{name}: native report CTA landed at invalid URL: {page.url}",\n            failures,\n        )\n        goto_root(page, base)\n'''
          if old not in source:
              raise SystemExit("Expected stale direct-link browser QA block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_three_report_launch_browser_qa.py
          git rm .github/workflows/qa-patch-native-home-browser-20260916.yml
          git commit -m "test: exercise native Home report navigation in browser QA"
          git push origin HEAD:fix/full-audit-2026-test-contracts
