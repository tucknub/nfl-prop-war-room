name: Margin Championship Raw-Power Gate

on:
  push:
    branches: [margin-research-v1]
    paths:
      - 'research/margin_v1/run_margin_standings_game_theory_raw_power.py'
      - 'research/margin_v1/run_margin_standings_game_theory.py'
      - 'research/margin_v1/run_margin_anchor_policy.py'
      - 'research/margin_v1/run_margin_anchor_safeguards.py'
      - 'research/margin_v1/run_margin_sensitivity.py'
      - '.github/workflows/margin-championship-raw-gate.yml'

permissions:
  contents: read

jobs:
  raw-power-championship-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn nflreadpy
      - name: Run raw-power standings game-theory gate
        run: python research/margin_v1/run_margin_standings_game_theory_raw_power.py
