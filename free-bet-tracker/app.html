<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191321"><title>Free Bet Tracker</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17151b}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#fff;border:1px solid #e6e1ea;border-radius:24px;padding:28px;text-align:center;box-shadow:0 14px 38px rgba(41,31,55,.10)}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#17111f,#7358bd);color:#fff;font-weight:900;font-size:28px}.title{font-size:24px;font-weight:900;letter-spacing:-.03em}.sub{margin-top:7px;color:#77727f;font-size:13px}.err{margin-top:14px;color:#a13c30;font-size:12px;display:none}</style></head><body><div class="load"><div class="box"><div class="mark">$</div><div class="title">Free Bet Tracker</div><div class="sub">Loading the latest tracker…</div><div class="err" id="err">Could not load the tracker. Refresh this page and try again.</div></div></div><script>

const priorityJS=`function choosePriority(active){if(!active.length)return null;const soon=active[0],soonMs=msLeft(soon.expires);if(soonMs<=24*60*60e3)return soon;const moneyRisk=active.filter(p=>p.kind==='bonus'&&Number(p.value||0)>0&&msLeft(p.expires)<=72*60*60e3).sort((a,b)=>msLeft(a.expires)-msLeft(b.expires)||Number(b.value||0)-Number(a.value||0))[0];return moneyRisk||null}function priorityReason(p){if(p.kind==='bonus')return'You lose '+money(p.value)+' in bonus-bet money if it is not used.';if(p.kind==='qualifier')return'Use the qualifying offer before this window closes if you want the bonus.';if(p.kind==='no_sweat')return'The no-sweat protection disappears when this offer expires.';return'This boost disappears when the timer hits zero.'}function priorityLabel(p,ms){if(ms<=15*60e3)return'EXPIRING NOW';if(ms<=60*60e3)return'FINAL HOUR';if(ms<=6*60*60e3)return'DO THIS NEXT';if(p.kind==='bonus')return'FREE MONEY AT RISK';return'NEEDS ATTENTION TODAY'}function priorityTone(ms){if(ms<=15*60e3)return'critical';if(ms<=60*60e3)return'final';if(ms<=6*60*60e3)return'hot';return'warn'}function renderPriority(active){const el=$('#priorityCenter'),p=choosePriority(active);if(!p){el.className='attention';el.innerHTML='';return}const ms=msLeft(p.expires),tone=priorityTone(ms);el.className='attention show '+tone;el.innerHTML='<div class="attentionTop"><div class="attentionBang">!</div><div class="attentionCopy"><div class="attentionLabel">'+priorityLabel(p,ms)+'</div><div class="attentionPromo">'+esc(p.book)+' · '+esc(p.promo)+'</div></div><div class="attentionTimer">'+timer(ms)+'</div></div><div class="attentionBottom"><div class="attentionReason">'+esc(priorityReason(p))+'</div><div class="attentionWhen">Expires<br>'+exact(p.expires)+(p.estimated?' · EST.':'')+'</div></div>'}`;

return html}
async function apiLoad(){const r=await fetch(API+'&ts='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('api');const j=await r.json();return decode64(j.content)}
