<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Free Bets">
<title>Free Bet Tracker</title>
<style>
:root{--bg:#f5f3f8;--surface:#fff;--ink:#17151b;--muted:#74717d;--line:#e7e3eb;--purple:#6f56b5;--purple2:#8f75d8;--red:#f8dedc;--redInk:#952f2c;--orange:#fff0dc;--orangeInk:#8a591e;--shadow:0 10px 28px rgba(42,34,56,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100svh}.app{max-width:580px;margin:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#18131f 0%,#2a2038 56%,#5e4894 130%);color:#fff;border-radius:24px;padding:20px 18px 18px;box-shadow:0 18px 44px rgba(46,33,69,.22);margin-bottom:14px}.hero:before{content:"";position:absolute;inset:auto -35px -70px auto;width:210px;height:210px;border:2px solid rgba(255,255,255,.08);border-radius:50%;box-shadow:0 0 0 24px rgba(255,255,255,.03),0 0 0 52px rgba(255,255,255,.02)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:2}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#cbbcf1}.top h1{font-size:28px;line-height:1;margin:5px 0 0;font-weight:900;letter-spacing:-.045em}.top p{margin:8px 0 0;color:#d4cde0;font-size:13px;line-height:1.45}.refresh{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);color:#fff;width:42px;height:42px;border-radius:14px;font-size:21px;font-weight:800;cursor:pointer}.logoRail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px;position:relative;z-index:2}.railLogo{height:46px;border-radius:13px;display:grid;place-items:center;padding:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);overflow:hidden}.railLogo img{max-width:100%;max-height:100%;object-fit:contain}.summary{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin:14px 0 10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 14px;box-shadow:0 5px 18px rgba(30,25,38,.04)}.label{font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.num{font-size:28px;font-weight:950;letter-spacing:-.045em;margin-top:6px}.danger .num{color:#a63e36}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin:0 3px 18px;line-height:1.45}.estimate{color:#8b651f}.updated{white-space:nowrap}.updated.stale{color:#99621f;font-weight:800}.updated.old,.offline{color:#a13c30;font-weight:900}.sectionRow{display:flex;align-items:end;justify-content:space-between;margin:0 3px 10px}.section{font-size:16px;font-weight:900;margin:0;letter-spacing:-.015em}.subtle{font-size:11px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:11px}details.card{--brand:#6f56b5;background:var(--surface);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);overflow:hidden;position:relative}details.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--brand)}details.card.urgent{border-color:#efb9b3;background:linear-gradient(180deg,#fff 0%,#fff 66%,var(--red) 170%)}details.card.soon{border-color:#efd6b5;background:linear-gradient(180deg,#fff 0%,#fff 68%,var(--orange) 180%)}summary{list-style:none;cursor:pointer;padding:15px 15px 14px 17px;outline:none}summary::-webkit-details-marker{display:none}.cardTop{display:flex;gap:12px;align-items:flex-start}.logoTile{width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:#f4f2f6;display:grid;place-items:center;padding:7px;overflow:hidden;border:1px solid rgba(0,0,0,.04)}.logoTile.dark{background:#17171a}.logoTile.green{background:#075a45}.logoTile img{max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:14px;font-weight:950;color:var(--brand)}.main{min-width:0;flex:1}.bookline{display:flex;align-items:center;gap:8px}.book{font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.055em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heroValue{margin-left:auto;font-size:21px;font-weight:950;letter-spacing:-.03em;white-space:nowrap;color:var(--ink)}.promo{font-size:15px;font-weight:850;margin-top:5px;line-height:1.25;letter-spacing:-.015em}.tapHint{font-size:11px;color:var(--purple);font-weight:800;margin-top:7px}.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid rgba(100,100,110,.13);margin-top:13px;padding-top:11px}.count{font-size:14px;font-weight:900}.urgent .count{color:var(--redInk)}.soon .count{color:var(--orangeInk)}.exact{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badges{display:flex;align-items:center;gap:7px}.pill{font-size:10px;font-weight:900;letter-spacing:.045em;text-transform:uppercase;color:var(--purple);background:#f1ecfb;padding:6px 8px;border-radius:9px}.pill.est{color:#76521f;background:#fff1db}.chev{font-size:18px;color:#8a8691;transition:transform .16s ease}details[open] .chev{transform:rotate(180deg)}.details{border-top:1px solid rgba(100,100,110,.13);padding:13px 16px 16px 17px;font-size:12px;line-height:1.55;color:#55515e;background:rgba(255,255,255,.58)}.detailLabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:4px}.empty{background:#fff;border:1px dashed #d5d0dc;border-radius:20px;padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.55;margin:20px 24px 0}
@media(min-width:700px){.app{padding-top:24px}.top h1{font-size:32px}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
  <div class="top"><div><div class="eyebrow">Promo wallet</div><h1>Free Bet Tracker</h1><p>Free money first. Urgent promos next.</p></div><button class="refresh" id="refresh" aria-label="Refresh">↻</button></div>
  <div class="logoRail" aria-label="Tracked sportsbooks">
    <div class="railLogo"><img src="https://dkstatic.s3.amazonaws.com/Creative-Development/2020/SB/Sportsbook_FC_on_dark.png" alt="DraftKings"></div>
    <div class="railLogo" style="background:#fff"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/Fanduel_logo.svg" alt="FanDuel"></div>
    <div class="railLogo" style="background:#fff"><img src="https://s202.q4cdn.com/508919455/files/images/fact-sheets-images/CaesarsSportsbook/6250018-1000x200-Medallia-Property-Logo-Resize-Caesars-Sportsbook-Digital-v2.jpg" alt="Caesars Sportsbook"></div>
    <div class="railLogo" style="background:#111"><img src="https://www.hardrock.bet/wp-content/uploads/2024/03/Hard-Rock-Bet-Logo-White.svg" alt="Hard Rock Bet"></div>
    <div class="railLogo" style="background:#07664f"><img src="https://upload.wikimedia.org/wikipedia/commons/d/dc/Bet365_Logo.svg" alt="bet365"></div>
  </div>
</section>
<section class="summary"><div class="stat"><div class="label">Bonus bet money</div><div class="num" id="money">$0</div></div><div class="stat danger"><div class="label">Under 24h</div><div class="num" id="urgent">0</div></div></section>
<div class="meta"><span><span id="active">0 active</span><span id="estimated" class="estimate"></span></span><span id="updated" class="updated">Loading…</span></div>
<div class="sectionRow"><h2 class="section">Expiring next</h2><span class="subtle">Soonest first</span></div>
<section class="list" id="list"></section>
<p class="note">Tap a promo for terms. Send me screenshots and I’ll keep the tracker current.</p>
</main>
<script>
const DATA_URL='https://raw.githubusercontent.com/tucknub/nfl-prop-war-room/streamlit-cloud-deploy/free-bet-tracker/promos.json';
const LOGOS={
'DraftKings':{url:'https://dkstatic.s3.amazonaws.com/Creative-Development/2020/SB/Sportsbook_FC_on_dark.png',cls:'dark',brand:'#62b715'},
'FanDuel':{url:'https://upload.wikimedia.org/wikipedia/commons/b/b5/Fanduel_logo.svg',cls:'',brand:'#1676d2'},
'Caesars':{url:'https://s202.q4cdn.com/508919455/files/images/fact-sheets-images/CaesarsSportsbook/6250018-1000x200-Medallia-Property-Logo-Resize-Caesars-Sportsbook-Digital-v2.jpg',cls:'',brand:'#8b6b38'},
'Hard Rock Bet':{url:'https://www.hardrock.bet/wp-content/uploads/2024/03/Hard-Rock-Bet-Logo-White.svg',cls:'dark',brand:'#d8b43d'},
'bet365':{url:'https://upload.wikimedia.org/wikipedia/commons/d/dc/Bet365_Logo.svg',cls:'green',brand:'#0b8c67'}
};
const $=s=>document.querySelector(s),list=$('#list');let promos=[],dataUpdatedAt=null;
function hrs(x){return(new Date(x).getTime()-Date.now())/36e5}function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0)}function exact(x){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x))}function updatedText(x){return 'Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x)).replace(',',' ·')}function left(h){if(h<1)return Math.max(1,Math.round(h*60))+'m left';if(h<48)return h.toFixed(h<10?1:0)+'h left';return Math.ceil(h/24)+'d left'}function cls(h){return h<24?'urgent':h<48?'soon':''}function initials(s){return s.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function hero(p){if(p.value>0)return money(p.value);const m=p.promo.match(/\b\d+%/);if(m)return m[0];if(p.kind==='no_sweat')return'No Sweat';if(p.kind==='qualifier')return'Earn $10';return'Promo'}function kind(p){return p.kind==='bonus'?'Bonus Bet':p.kind==='no_sweat'?'No Sweat':p.kind==='qualifier'?'Bet & Get':'Boost'}
function freshness(){const el=$('#updated');if(!dataUpdatedAt)return;const age=(Date.now()-new Date(dataUpdatedAt).getTime())/36e5;el.className='updated';if(age>=24)el.classList.add('old');else if(age>=12)el.classList.add('stale');el.textContent=updatedText(dataUpdatedAt)}
function logoTile(book){const l=LOGOS[book];if(!l)return `<div class="logoTile"><span class="fallback">${initials(book)}</span></div>`;return `<div class="logoTile ${l.cls}"><img src="${l.url}" alt="${esc(book)} logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${initials(book)}</span></div>`}
function render(){const active=promos.filter(p=>hrs(p.expires)>=0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));$('#money').textContent=money(active.filter(p=>p.kind==='bonus').reduce((s,p)=>s+Number(p.value||0),0));$('#urgent').textContent=active.filter(p=>hrs(p.expires)<24).length;$('#active').textContent=active.length+' active';const est=active.filter(p=>p.estimated).length;$('#estimated').textContent=est?' · '+est+' estimated'+(est===1?'':'')+' expirations':'';if(!active.length){list.innerHTML='<div class="empty"><strong>Nothing waiting</strong>No active promos are currently tracked.</div>';freshness();return}list.innerHTML=active.map(p=>{const h=hrs(p.expires),l=LOGOS[p.book]||{brand:'#6f56b5'};return `<details class="card ${cls(h)}" style="--brand:${l.brand}"><summary><div class="cardTop">${logoTile(p.book)}<div class="main"><div class="bookline"><div class="book">${esc(p.book)}</div><div class="heroValue">${esc(hero(p))}</div></div><div class="promo">${esc(p.promo)}</div><div class="tapHint">Tap for terms</div></div></div><div class="foot"><div><span class="count">${left(h)}</span><span class="exact">Expires ${exact(p.expires)}</span></div><span class="badges"><span class="pill ${p.estimated?'est':''}">${p.estimated?'Est.':kind(p)}</span><span class="chev">⌄</span></span></div></summary><div class="details"><div class="detailLabel">Terms / notes</div><div>${esc(p.notes||'No extra terms captured.')}</div></div></details>`}).join('');freshness()}
async function getJson(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('load');return r.json()}async function load(){try{const d=await getJson(DATA_URL);promos=Array.isArray(d.promos)?d.promos:[];dataUpdatedAt=d.updatedAt||null;render()}catch{$('#updated').textContent='Refresh failed';$('#updated').className='updated offline'}}
$('#refresh').onclick=load;load();setInterval(load,60000);setInterval(()=>{render();freshness()},15000);
</script>
</body>
</html>
