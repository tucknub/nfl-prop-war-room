name: Temporary Fantasy HQ Python 3.14 Import Check

on:
  push:
    paths:
      - ".github/workflows/temp-fantasy-hq-py314-import.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import Fantasy HQ dependencies
        run: |
          python - <<'PY'
          from src.fantasy.free_agents import (
              FANTASY_POSITIONS,
              build_live_free_agent_pool,
              filter_live_free_agents,
          )
          print("free_agents import ok", FANTASY_POSITIONS)
          PY
      - name: Compile Fantasy HQ
        run: python -m py_compile dashboard/pages/11_Fantasy_HQ.py
