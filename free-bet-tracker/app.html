<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191321"><title>Free Bet Tracker</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17151b}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#fff;border:1px solid #e6e1ea;border-radius:24px;padding:28px;text-align:center;box-shadow:0 14px 38px rgba(41,31,55,.10)}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#17111f,#7358bd);color:#fff;font-weight:900;font-size:28px}.title{font-size:24px;font-weight:900;letter-spacing:-.03em}.sub{margin-top:7px;color:#77727f;font-size:13px}.err{margin-top:14px;color:#a13c30;font-size:12px;display:none}</style></head><body><div class="load"><div class="box"><div class="mark">$</div><div class="title">Free Bet Tracker</div><div class="sub">Loading the latest tracker…</div><div class="err" id="err">Could not load the tracker. Refresh this page and try again.</div></div></div><script>
const API='https://api.github.com/repos/tucknub/nfl-prop-war-room/contents/free-bet-tracker/index.html?ref=streamlit-cloud-deploy';
const PINNED='https://rawcdn.githack.com/tucknub/nfl-prop-war-room/ba84938255764d2c47585d888648691c26396507/free-bet-tracker/index.html';
function decode64(s){const bin=atob(s.replace(/\s/g,'')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function patch(html){html=html.replace('content="6.1"','content="6.3"');html=html.replace('candidates.sort((a,b)=>stamp(b.data)-stamp(a.data));const best=candidates[0];','candidates.sort((a,b)=>stamp(b.data)-stamp(a.data)||Number(b.live)-Number(a.live));const best=candidates[0];');html=html.replace('.logoRail{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.logoRail::-webkit-scrollbar{display:none}.railLogo{height:45px;min-width:66px;flex:1 0 66px;','.logoRail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.railLogo{height:45px;min-width:0;');html=html.replace('.logoRail{position:relative;z-index:2;display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.logoRail::-webkit-scrollbar{display:none}.railLogo{height:45px;min-width:66px;flex:1 0 66px;','.logoRail{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.railLogo{height:45px;min-width:0;');html=html.replace("function timer(ms){if(ms<=0)return'Expired';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;if(d>0)return`${d}d ${h}h`;if(h>0)return`${h}h ${m}m`;return`${m}:${String(sec).padStart(2,'0')}`}","function timer(ms){if(ms<=0)return'Expired';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;if(d>0)return`${d}d ${h}h ${m}m ${sec}s`;if(h>0)return`${h}h ${m}m ${sec}s`;if(m>0)return`${m}m ${sec}s`;return`${sec}s`}");return html}
async function apiLoad(){const r=await fetch(API+'&ts='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('api');const j=await r.json();return decode64(j.content)}
async function rawLoad(){const r=await fetch(PINNED+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('raw');return r.text()}
(async()=>{try{let html;try{html=await apiLoad()}catch{html=await rawLoad()}document.open();document.write(patch(html));document.close()}catch(e){document.getElementById('err').style.display='block'}})();
</script></body></html>
