name: Apply Report Snap Identity Gate

on:
  pull_request:
    paths:
      - ".github/workflows/apply-report-snap-gate.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: propwar-2026-operational-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Separate all-offense diagnostics from report-position gate
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline = Path('src/operations/current_role_pipeline.py')
          text = pipeline.read_text(encoding='utf-8')
          old = '''    opportunity_players = events[["season", "week", "game_id", "team", "player_id"]].drop_duplicates()\n    opportunity_identity_rate = float(events["identity_resolved"].fillna(False).mean())\n    snap_identity_rate = float(snap_coverage["resolved_snap_rows"].sum() / snap_coverage["snap_rows"].sum())\n    join_coverage = pd.DataFrame(\n        [\n            {"season": season, "join": "opportunity_to_identity", "rows": len(events), "matched_rows": int(events["identity_resolved"].fillna(False).sum()), "coverage_rate": opportunity_identity_rate},\n            {"season": season, "join": "snap_to_identity", "rows": int(snap_coverage["snap_rows"].sum()), "matched_rows": int(snap_coverage["resolved_snap_rows"].sum()), "coverage_rate": snap_identity_rate},\n            {"season": season, "join": "opportunity_to_snap_spine", "rows": len(opportunity_players), "matched_rows": len(opportunity_players) - missing_event_snap, "coverage_rate": event_snap_rate},\n        ]\n    )\n'''
          new = '''    opportunity_players = events[["season", "week", "game_id", "team", "player_id"]].drop_duplicates()\n    opportunity_identity_rate = float(events["identity_resolved"].fillna(False).mean())\n    snap_identity_rate = float(snap_coverage["resolved_snap_rows"].sum() / snap_coverage["snap_rows"].sum())\n    report_positions = set(ROLE_FAMILIES)\n    resolved_report_snap_rows = int(spine["position"].isin(report_positions).sum())\n    unresolved_report_snap_rows = int(\n        unresolved_snaps["position"].fillna("").astype(str).str.upper().str.strip().isin(report_positions).sum()\n    )\n    report_snap_rows = resolved_report_snap_rows + unresolved_report_snap_rows\n    report_snap_identity_rate = (\n        float(resolved_report_snap_rows / report_snap_rows) if report_snap_rows else 1.0\n    )\n    join_coverage = pd.DataFrame(\n        [\n            {"season": season, "join": "opportunity_to_identity", "rows": len(events), "matched_rows": int(events["identity_resolved"].fillna(False).sum()), "coverage_rate": opportunity_identity_rate},\n            {"season": season, "join": "snap_to_identity_all_offense", "rows": int(snap_coverage["snap_rows"].sum()), "matched_rows": int(snap_coverage["resolved_snap_rows"].sum()), "coverage_rate": snap_identity_rate},\n            {"season": season, "join": "snap_to_identity_report_positions", "rows": report_snap_rows, "matched_rows": resolved_report_snap_rows, "coverage_rate": report_snap_identity_rate},\n            {"season": season, "join": "opportunity_to_snap_spine", "rows": len(opportunity_players), "matched_rows": len(opportunity_players) - missing_event_snap, "coverage_rate": event_snap_rate},\n        ]\n    )\n'''
          if old not in text:
              raise SystemExit('join coverage block not found')
          text = text.replace(old, new, 1)

          old_source = '''                "unresolved_snap_rows": len(unresolved_snaps),\n                "opportunity_identity_coverage": opportunity_identity_rate,\n                "snap_identity_coverage": snap_identity_rate,\n                "opportunity_to_snap_coverage": event_snap_rate,\n'''
          new_source = '''                "unresolved_snap_rows": len(unresolved_snaps),\n                "report_snap_rows": report_snap_rows,\n                "unresolved_report_snap_rows": unresolved_report_snap_rows,\n                "opportunity_identity_coverage": opportunity_identity_rate,\n                "snap_identity_coverage": snap_identity_rate,\n                "report_snap_identity_coverage": report_snap_identity_rate,\n                "opportunity_to_snap_coverage": event_snap_rate,\n'''
          if old_source not in text:
              raise SystemExit('source coverage block not found')
          text = text.replace(old_source, new_source, 1)

          old_limit = '''            "Snap counts are required before a completed week can publish.",\n            "Only consecutive fully completed regular-season weeks are admitted.",\n'''
          new_limit = '''            "Snap counts are required before a completed week can publish.",\n            "RB, WR, and TE snap identity coverage gates publication; all-offense coverage remains a diagnostic.",\n            "Only consecutive fully completed regular-season weeks are admitted.",\n'''
          if old_limit not in text:
              raise SystemExit('manifest limitations block not found')
          text = text.replace(old_limit, new_limit, 1)

          old_validation = '''    add("opportunity_identity_coverage", float(build.source_coverage.iloc[0]["opportunity_identity_coverage"]) == 1.0, float(build.source_coverage.iloc[0]["opportunity_identity_coverage"]), 1.0)\n    add("snap_identity_coverage", float(build.source_coverage.iloc[0]["snap_identity_coverage"]) >= 0.99, float(build.source_coverage.iloc[0]["snap_identity_coverage"]), ">= 0.99")\n    add("opportunity_to_snap_coverage", float(build.source_coverage.iloc[0]["opportunity_to_snap_coverage"]) >= 0.995, float(build.source_coverage.iloc[0]["opportunity_to_snap_coverage"]), ">= 0.995")\n'''
          new_validation = '''    add("opportunity_identity_coverage", float(build.source_coverage.iloc[0]["opportunity_identity_coverage"]) == 1.0, float(build.source_coverage.iloc[0]["opportunity_identity_coverage"]), 1.0)\n    add("all_offense_snap_identity_coverage", float(build.source_coverage.iloc[0]["snap_identity_coverage"]) >= 0.95, float(build.source_coverage.iloc[0]["snap_identity_coverage"]), ">= 0.95 diagnostic floor")\n    add("report_snap_identity_coverage", float(build.source_coverage.iloc[0]["report_snap_identity_coverage"]) >= 0.99, float(build.source_coverage.iloc[0]["report_snap_identity_coverage"]), ">= 0.99")\n    add("opportunity_to_snap_coverage", float(build.source_coverage.iloc[0]["opportunity_to_snap_coverage"]) >= 0.995, float(build.source_coverage.iloc[0]["opportunity_to_snap_coverage"]), ">= 0.995")\n'''
          if old_validation not in text:
              raise SystemExit('validation coverage block not found')
          pipeline.write_text(text.replace(old_validation, new_validation, 1), encoding='utf-8')

          tests = Path('tests/test_current_role_operations.py')
          text = tests.read_text(encoding='utf-8')
          if 'from dataclasses import replace' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom dataclasses import replace\n', 1)
          if 'test_report_snap_identity_is_the_publication_gate' not in text:
              text += '''\n\ndef test_report_snap_identity_is_the_publication_gate() -> None:\n    build = build_current_role_outputs(\n        season=SEASON,\n        through_week=1,\n        completed_game_ids=[GAME_1],\n        pbp=pbp(),\n        player_stats=player_stats(),\n        rosters_weekly=rosters(),\n        snap_counts=snap_counts(),\n        schedules=schedules(),\n    )\n    coverage = build.source_coverage.copy()\n    coverage.loc[:, "snap_identity_coverage"] = 0.98\n    coverage.loc[:, "report_snap_identity_coverage"] = 1.0\n    checks = {item["check"]: item for item in validate_current_role_build(replace(build, source_coverage=coverage))}\n    assert checks["all_offense_snap_identity_coverage"]["passed"]\n    assert checks["report_snap_identity_coverage"]["passed"]\n\n    coverage.loc[:, "report_snap_identity_coverage"] = 0.98\n    checks = {item["check"]: item for item in validate_current_role_build(replace(build, source_coverage=coverage))}\n    assert not checks["report_snap_identity_coverage"]["passed"]\n'''
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted tests
        run: python -m pytest -q tests/test_current_role_operations.py

      - name: Commit source policy
        run: |
          git config user.name "propwar-operations"
          git config user.email "actions@users.noreply.github.com"
          git add src/operations/current_role_pipeline.py tests/test_current_role_operations.py
          git commit -m "Gate publication on report-position snap identity"
          git push origin HEAD:propwar-2026-operational-readiness
