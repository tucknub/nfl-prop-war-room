<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d5cae" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Free Bets" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Free Bet Tracker</title>
  <style>
    :root{
      --bg:#f7f7fa;
      --surface:#ffffff;
      --text:#17171c;
      --muted:#73737f;
      --border:#e5e5ec;
      --purple:#6d5cae;
      --purple-soft:#f3f0f8;
      --urgent:#f4cccc;
      --urgent-text:#7c2020;
      --soon:#fce5cd;
      --soon-text:#7b4a1f;
      --used:#d9ead3;
      --used-text:#285a2c;
      --expired:#e6e6e6;
      --expired-text:#66666f;
      --shadow:0 8px 24px rgba(32,31,39,.07);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{min-height:100svh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit}
    .app{max-width:560px;margin:0 auto;padding:18px 16px 28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .title h1{font-size:25px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.035em}
    .title p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .iconbtn{border:0;background:var(--purple-soft);color:var(--purple);width:42px;height:42px;border-radius:14px;font-size:22px;font-weight:600;display:grid;place-items:center;cursor:pointer}
    .summary{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:18px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 14px;box-shadow:0 4px 14px rgba(20,20,30,.035)}
    .stat .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .stat .value{font-size:25px;font-weight:850;letter-spacing:-.035em;margin-top:5px}
    .stat.alert .value{color:#a13c30}
    .sectionhead{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
    .sectionhead h2{font-size:15px;margin:0;font-weight:800;letter-spacing:-.01em}
    .sectionhead button{background:transparent;border:0;color:var(--purple);font-size:13px;font-weight:750;cursor:pointer}
    .list{display:flex;flex-direction:column;gap:10px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
    .card.urgent{background:linear-gradient(180deg,#fff 0%,#fff 52%,var(--urgent) 160%);border-color:#efb7b7}
    .card.soon{background:linear-gradient(180deg,#fff 0%,#fff 56%,var(--soon) 170%);border-color:#f0d3b9}
    .card.expired{background:#f0f0f2;color:var(--expired-text);border-color:#dddddf;box-shadow:none}
    .card.used{background:#f0f7ed;border-color:#cfe3c7;opacity:.78;box-shadow:none}
    .cardtop{display:flex;align-items:flex-start;gap:12px}
    .bookmark{width:44px;height:44px;border-radius:13px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;font-weight:850;font-size:15px;flex:0 0 auto}
    .cardmain{min-width:0;flex:1}
    .bookrow{display:flex;align-items:center;gap:8px;min-width:0}
    .book{font-weight:850;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .amount{margin-left:auto;font-weight:900;font-size:20px;letter-spacing:-.025em}
    .promo{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .timebar{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(100,100,110,.14);gap:10px}
    .time strong{display:block;font-size:14px;letter-spacing:-.01em}
    .time span{font-size:11px;color:var(--muted)}
    .urgent .time strong{color:var(--urgent-text)}
    .soon .time strong{color:var(--soon-text)}
    .usedbtn{border:0;border-radius:12px;background:#ededf2;color:#4c4c56;font-weight:800;font-size:13px;padding:10px 13px;cursor:pointer}
    .usedbtn.done{background:var(--used);color:var(--used-text)}
    .empty{text-align:center;padding:46px 18px;background:var(--surface);border:1px dashed #d7d7df;border-radius:20px;color:var(--muted)}
    .empty .big{font-size:30px;margin-bottom:8px}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
    .fabwrap{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,247,250,0),rgba(247,247,250,.92) 34%,var(--bg) 58%);pointer-events:none}
    .fab{max-width:560px;margin:0 auto;display:block;width:100%;border:0;border-radius:16px;background:var(--purple);color:white;font-weight:850;padding:15px 18px;font-size:15px;box-shadow:0 10px 30px rgba(109,92,174,.28);pointer-events:auto;cursor:pointer}
    .sheetbackdrop{position:fixed;inset:0;background:rgba(20,18,30,.38);display:none;align-items:flex-end;z-index:20}
    .sheetbackdrop.open{display:flex}
    .sheet{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88svh;overflow:auto;box-shadow:0 -10px 40px rgba(20,18,30,.16)}
    .grab{width:38px;height:4px;background:#d8d8df;border-radius:99px;margin:2px auto 16px}
    .sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheethead h3{margin:0;font-size:20px;letter-spacing:-.025em}.close{border:0;background:#f0f0f4;width:36px;height:36px;border-radius:12px;font-size:20px;color:#555;cursor:pointer}
    .grid{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:#fbfbfd;border-radius:13px;padding:13px 12px;outline:none;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#aa9dd5;box-shadow:0 0 0 3px rgba(109,92,174,.10)}.field textarea{min-height:80px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;background:var(--purple);color:white;border-radius:14px;padding:14px;font-weight:850;margin-top:4px;cursor:pointer}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.45}
    @media (min-width:700px){.app{padding-top:26px}.fabwrap{padding-bottom:18px}.sheet{border-radius:24px;margin-bottom:18px}.sheetbackdrop{align-items:center}.summary{grid-template-columns:1fr 1fr}.title h1{font-size:29px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title"><h1>Free Bet Tracker</h1><p>Use the money before the clock does.</p></div>
    </header>

    <section class="summary" aria-label="Summary">
      <div class="stat"><div class="label">Active value</div><div class="value" id="activeValue">$0</div></div>
      <div class="stat alert"><div class="label">Under 24h</div><div class="value" id="expiringCount">0</div></div>
    </section>

    <div class="sectionhead"><h2>Active promos</h2><button id="sortBtn">Soonest first</button></div>
    <section class="list" id="promoList"></section>
  </main>

  <div class="fabwrap"><button class="fab" id="addBtn">+ Add promo</button></div>

  <div class="sheetbackdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <form class="sheet" id="promoForm">
      <div class="grab"></div>
      <div class="sheethead"><h3 id="formTitle">Add promo</h3><button class="close" type="button" id="closeBtn" aria-label="Close">×</button></div>
      <div class="grid">
        <div class="field"><label for="book">Sportsbook</label><select id="book" required><option value="">Choose sportsbook</option><option>DraftKings</option><option>FanDuel</option><option>bet365</option><option>Caesars</option><option>BetMGM</option><option>Fanatics</option><option>Hard Rock Bet</option><option>ESPN BET</option><option>Other</option></select></div>
        <div class="twocol">
          <div class="field"><label for="value">Value</label><input id="value" inputmode="decimal" placeholder="$10" required /></div>
          <div class="field"><label for="expires">Expires</label><input id="expires" type="datetime-local" required /></div>
        </div>
        <div class="field"><label for="promo">Promo / Free Bet</label><input id="promo" placeholder="Bonus Bet, Boomerang, etc." /></div>
        <div class="field"><label for="notes">Notes</label><textarea id="notes" placeholder="Anything you need to remember"></textarea></div>
        <button class="save" type="submit">Save promo</button>
        <div class="hint" id="syncHint">Saved securely on this device. Google Sheet sync will take over automatically when the connected endpoint is enabled.</div>
      </div>
    </form>
  </div>

  <script>
    const KEY='free-bet-mobile-v2';
    const API_URL=''; // Google Apps Script /exec URL goes here once deployed.
    let promos=[];
    let remoteEnabled=Boolean(API_URL);
    try{promos=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{promos=[]}
    const $=s=>document.querySelector(s);
    const list=$('#promoList'), backdrop=$('#backdrop');

    function initials(book){return book.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
    function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0)}
    function remaining(exp){return (new Date(exp).getTime()-Date.now())/36e5}
    function fmtExpiry(exp){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(exp))}
    function remainingLabel(h){if(h<0)return 'Expired'; if(h<1)return `${Math.max(1,Math.round(h*60))}m left`; if(h<48)return `${h.toFixed(h<10?1:0)}h left`; return `${Math.ceil(h/24)}d left`}
    function statusClass(p){if(p.used)return 'used'; const h=remaining(p.expires); if(h<0)return 'expired'; if(h<24)return 'urgent'; if(h<48)return 'soon'; return ''}
    function saveLocal(){localStorage.setItem(KEY,JSON.stringify(promos))}
    async function postRemote(payload){
      if(!remoteEnabled)return;
      const body=new URLSearchParams(payload);
      try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body})}catch(e){console.warn('Sheet sync write failed',e)}
    }
    function save(){saveLocal();render()}
    function loadRemote(){
      if(!remoteEnabled)return;
      const cb='freeBetSync_'+Date.now();
      window[cb]=data=>{
        try{if(Array.isArray(data?.promos)){promos=data.promos;saveLocal();render();document.querySelector('#syncHint').textContent='Synced with Google Sheet.'}}finally{delete window[cb];script.remove()}
      };
      const script=document.createElement('script');
      script.src=API_URL+'?action=list&callback='+encodeURIComponent(cb)+'&_='+Date.now();
      script.onerror=()=>{delete window[cb];script.remove()};
      document.body.appendChild(script);
    }
    function render(){
      const active=promos.filter(p=>!p.used && remaining(p.expires)>=0);
      $('#activeValue').textContent=money(active.reduce((a,p)=>a+Number(p.value||0),0));
      $('#expiringCount').textContent=active.filter(p=>remaining(p.expires)<24).length;
      const ordered=promos.filter(p=>!p.used).sort((a,b)=>new Date(a.expires)-new Date(b.expires));
      if(!ordered.length){list.innerHTML=`<div class="empty"><div class="big">◷</div><strong>No promos waiting</strong>Add a free bet or boost and the urgent ones will rise to the top.</div>`;return}
      list.innerHTML=ordered.map(p=>{
        const h=remaining(p.expires), cls=statusClass(p);
        return `<article class="card ${cls}">
          <div class="cardtop">
            <div class="bookmark">${initials(p.book)}</div>
            <div class="cardmain">
              <div class="bookrow"><div class="book">${escapeHtml(p.book)}</div><div class="amount">${money(p.value)}</div></div>
              <div class="promo">${escapeHtml(p.promo||'Free bet / promo')}</div>
            </div>
          </div>
          <div class="timebar">
            <div class="time"><strong>${p.used?'Used':remainingLabel(h)}</strong><span>${fmtExpiry(p.expires)}</span></div>
            <button class="usedbtn ${p.used?'done':''}" data-id="${p.id}">${p.used?'✓ Used':'Mark used'}</button>
          </div>
        </article>`
      }).join('');
      document.querySelectorAll('.usedbtn').forEach(btn=>btn.onclick=()=>{const p=promos.find(x=>x.id===btn.dataset.id); if(p){p.used=!p.used;save();postRemote({action:'used',id:p.id,used:String(p.used)})}})
    }
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function openForm(){backdrop.classList.add('open');setTimeout(()=>$('#book').focus(),50)}
    function closeForm(){backdrop.classList.remove('open');$('#promoForm').reset()}
    $('#addBtn').onclick=openForm; $('#closeBtn').onclick=closeForm; backdrop.onclick=e=>{if(e.target===backdrop)closeForm()};
    $('#promoForm').onsubmit=e=>{
      e.preventDefault();
      const raw=$('#value').value.replace(/[^0-9.]/g,'');
      const item={id:crypto.randomUUID(),book:$('#book').value,value:Number(raw||0),expires:$('#expires').value,promo:$('#promo').value.trim(),notes:$('#notes').value.trim(),used:false,createdAt:new Date().toISOString()};
      promos.push(item);
      save();postRemote({action:'add',...item,expiresEpoch:String(new Date(item.expires).getTime()),used:String(item.used)}); closeForm();
    };
    $('#sortBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
    render();
    loadRemote();
    setInterval(()=>{render();loadRemote()},60000);
  </script>
</body>
</html>
