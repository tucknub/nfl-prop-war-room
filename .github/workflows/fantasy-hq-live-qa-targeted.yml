name: Fantasy HQ Live QA Targeted

on:
  push:
    branches:
      - fantasy-hq-live-qa-hardening

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Find first full-suite failure
        run: pytest -x -vv
