name: Live proving round 3

on:
  push:
    paths:
      - ".github/workflows/temp-live-proving-round3.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile round 3 surfaces
        run: |
          python -m py_compile src/owner/preferences.py
          python -m py_compile dashboard/owner_preferences.py
          python -m py_compile dashboard/glitch_radar_enrich.py
          python -m py_compile dashboard/propwar_today_owner.py
          python -m py_compile dashboard/player_command_owner.py
          python -m py_compile dashboard/pages/11_Fantasy_HQ.py
          python -m py_compile dashboard/app.py
      - name: Run product, owner preference, market, role, and fantasy regressions
        run: |
          pytest -q             tests/test_owner_preferences.py             tests/test_live_proving_round1.py             tests/test_live_proving_round2.py             tests/test_product_consolidation.py             tests/test_product_consolidation_phase2.py             tests/test_dashboard_app_import_path.py             tests/test_public_role_research_language.py             tests/test_role_change_detector.py             tests/test_glitch_radar_*.py             tests/test_fantasy_*.py
      - name: Streamlit core-page startup from production-like cwd
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          targets = [
              root / "dashboard" / "app.py",
              root / "dashboard" / "pages" / "02_Players.py",
              root / "dashboard" / "pages" / "09_Glitch_Radar.py",
              root / "dashboard" / "pages" / "11_Fantasy_HQ.py",
          ]
          os.chdir("/tmp")
          for target in targets:
              at = AppTest.from_file(str(target))
              at.run(timeout=60)
              if at.exception:
                  print(f"FAILED: {target}")
                  for exc in at.exception:
                      print(exc.value)
                  raise SystemExit(1)
              print(f"startup ok: {target.name}")
          PY
