name: DepthSnap Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "dashboard/launch_contract.py"
      - "dashboard/research_data.py"
      - "dashboard/weekly_report.py"
      - "docs/depthsnap/**"
      - "docs/propwar/NEXTJS_PUBLIC_APP_MIGRATION.md"
      - "outputs/role_research/**"
      - "scripts/export_depthsnap.py"
      - "scripts/publish_current_depthsnap.py"
      - "scripts/rehearse_depthsnap_release.py"
      - "src/export/depthsnap_exporter.py"
      - "src/export/depthsnap_release.py"
      - "src/load/build_identity_crosswalk.py"
      - "tests/fixtures/depthsnap_role_status_blocked_2026.json"
      - "tests/test_depthsnap_exporter.py"
      - "tests/test_depthsnap_release.py"
      - ".github/workflows/depthsnap-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python exporter dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Python exporter, parity, and atomic operations
        working-directory: .
        run: |
          python -m pytest tests/test_depthsnap_exporter.py tests/test_depthsnap_release.py -q
          python scripts/rehearse_depthsnap_release.py

      - name: Verify existing Python methodology and correctness
        working-directory: .
        run: python -m pytest tests -q

      - name: Check Python dependency consistency
        working-directory: .
        run: python -m pip check

      - name: Validate active and historical registries in Python
        working-directory: .
        run: |
          python scripts/export_depthsnap.py validate apps/web/public/data/depthsnap/export
          python scripts/export_depthsnap.py validate apps/web/public/data/depthsnap/export-historical-2025

      - name: Install dependencies
        run: npm ci

      - name: Audit full and production npm dependencies
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=critical

      - name: Snapshot committed fixtures
        run: |
          fixture_snapshot="$(mktemp -d)"
          cp -a public/data/depthsnap/fixture "$fixture_snapshot/fixture"
          cp -a public/data/depthsnap/fixture-no-published-week "$fixture_snapshot/fixture-no-published-week"
          cp -a public/data/depthsnap/fixture-unavailable "$fixture_snapshot/fixture-unavailable"
          echo "DEPTHSNAP_FIXTURE_SNAPSHOT=$fixture_snapshot" >> "$GITHUB_ENV"

      - name: Regenerate deterministic fixtures
        run: npm run generate:data

      - name: Verify committed fixture bytes
        run: |
          diff --recursive "$DEPTHSNAP_FIXTURE_SNAPSHOT/fixture" public/data/depthsnap/fixture
          diff --recursive "$DEPTHSNAP_FIXTURE_SNAPSHOT/fixture-no-published-week" public/data/depthsnap/fixture-no-published-week
          diff --recursive "$DEPTHSNAP_FIXTURE_SNAPSHOT/fixture-unavailable" public/data/depthsnap/fixture-unavailable

      - name: Validate DepthSnap data contracts
        run: npm run validate:data

      - name: Measure DepthSnap registry load
        run: npm run measure:data

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run fixture browser verification
        run: npm run test:e2e

      - name: Run active export browser verification
        run: npm run test:e2e:export-active

      - name: Prepare isolated historical export root
        run: npm run prepare:export-e2e

      - name: Run historical export browser verification
        run: npm run test:e2e:export-historical

      - name: Create and audit production package, then smoke test it
        run: npm run package:production

      - name: Prepare isolated release-state roots
        run: npm run prepare:release-states

      - name: Run unavailable and contract-failure production verification
        run: npm run test:e2e:release-states

      - name: Re-audit production package isolation
        run: npm run audit:production

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: depthsnap-browser-evidence
          path: |
            apps/web/artifacts
            docs/depthsnap/reviews/phase4b-export/*.png
            docs/depthsnap/reviews/release-readiness/*.png
          if-no-files-found: warn
