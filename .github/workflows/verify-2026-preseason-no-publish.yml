name: Verify 2026 Preseason No Publish

on:
  pull_request:
    paths:
      - ".github/workflows/verify-2026-preseason-no-publish.yml"

jobs:
  verify-preseason:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 2026 preseason no-publish build
        run: |
          python scripts/run_current_role_research.py \
            --season 2026 \
            --source-cache-dir /tmp/propwar-2026-cache \
            --output-dir /tmp/propwar-2026-output \
            --report-dir /tmp/propwar-2026-reports \
            --refresh \
            --no-publish

      - name: Enforce preseason fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          attempt_path = Path('/tmp/propwar-2026-reports/role_research_attempt_2026.json')
          payload = json.loads(attempt_path.read_text(encoding='utf-8'))

          assert payload['status'] in {'PRESEASON', 'WAITING_FOR_COMPLETED_WEEK'}, payload
          assert payload.get('published_through_week') is None, payload
          assert payload.get('completed_games', 0) == 0, payload

          public_candidates = list(Path('/tmp/propwar-2026-output').glob('*2026*live*'))
          assert not public_candidates, public_candidates

          print(json.dumps(payload, indent=2))
          PY

      - name: Confirm repository remained unchanged
        run: |
          test -z "$(git status --porcelain)"

      - name: Upload preseason evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preseason-2026-no-publish-evidence
          path: |
            /tmp/propwar-2026-reports
            /tmp/propwar-2026-output
          if-no-files-found: warn
