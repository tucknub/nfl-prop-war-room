name: Prove Fixed Live PropWar QA 2026-09-16

on:
  push:
    branches:
      - qa/live-postmerge-20260916
    paths:
      - .github/workflows/qa-live-postmerge-20260916.yml

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-mobile-expander-validator-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Warm live Streamlit app
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlopen('https://propwar.streamlit.app', timeout=30).read(1024)
          PY
          sleep 15
      - name: Verify live desktop/public/auth-safe surfaces
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit.py
      - name: Verify fixed live mobile surfaces
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit_mobile.py
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixed-live-propwar-qa-20260916
          path: /tmp/propwar-live-qa
          if-no-files-found: warn
