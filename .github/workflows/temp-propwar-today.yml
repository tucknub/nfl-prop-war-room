name: PropWar Today validation

on:
  push:
    paths:
      - ".github/workflows/temp-propwar-today.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Today modules and homepage
        run: |
          python -m py_compile dashboard/propwar_today.py
          python -m py_compile dashboard/propwar_today_owner.py
          python -m py_compile dashboard/app.py
      - name: Run PropWar Today cross-module regressions
        run: |
          pytest -q             tests/test_propwar_today.py             tests/test_propwar_today_owner.py             tests/test_fantasy_action_feed.py             tests/test_glitch_radar_why_now.py             tests/test_glitch_radar_books.py             tests/test_glitch_radar_present.py             tests/test_role_change_detector.py             tests/test_role_research.py             tests/test_margin_championship.py             tests/test_margin_pool_state.py             tests/test_margin_state_store.py             tests/test_public_role_research_language.py
      - name: Streamlit homepage startup
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          sys.path.insert(0, str(root / "dashboard"))
          sys.path.insert(0, str(root))

          at = AppTest.from_file("dashboard/app.py")
          at.run(timeout=45)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("PropWar homepage startup ok")
          PY
