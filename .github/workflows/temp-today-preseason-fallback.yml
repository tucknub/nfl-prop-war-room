name: Today preseason fallback hotfix
# rerun after dynamic Fantasy-link assertion

on:
  push:
    paths:
      - ".github/workflows/temp-today-preseason-fallback.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Today
        run: |
          python -m py_compile dashboard/propwar_today_owner.py
      - name: Run Today and product regressions
        run: |
          pytest -q             tests/test_propwar_today.py             tests/test_propwar_today_owner.py             tests/test_live_proving_round1.py             tests/test_live_proving_round2.py             tests/test_product_consolidation.py             tests/test_product_consolidation_phase2.py             tests/test_dashboard_app_import_path.py
      - name: Streamlit homepage startup
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          app = root / "dashboard" / "app.py"
          os.chdir("/tmp")
          at = AppTest.from_file(str(app))
          at.run(timeout=60)
          if at.exception:
              for exc in at.exception:
                  print(exc.value)
              raise SystemExit(1)
          print("Homepage startup ok")
          PY
