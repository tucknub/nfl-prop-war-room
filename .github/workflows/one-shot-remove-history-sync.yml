name: One-shot remove fragile browser history sync calls

on:
  push:
    branches:
      - streamlit-cloud-deploy
    paths:
      - .github/workflows/one-shot-remove-history-sync.yml

permissions:
  contents: write

jobs:
  remove-history-sync-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: streamlit-cloud-deploy
          fetch-depth: 0

      - name: Remove runtime history-sync calls and add regression guard
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path("dashboard").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              new = text.replace("\nenable_browser_history_sync()\n", "\n")
              new = new.replace("\n    enable_browser_history_sync()\n", "\n")
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          test_path = Path("tests/test_no_runtime_browser_history_sync.py")
          test_path.write_text(
              '''from pathlib import Path\n\n\ndef test_browser_history_sync_is_never_invoked_by_dashboard_pages() -> None:\n    offenders: list[str] = []\n    for path in Path("dashboard").rglob("*.py"):\n        if path.name == "control_state.py":\n            continue\n        for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):\n            stripped = line.strip()\n            if stripped == "enable_browser_history_sync()":\n                offenders.append(f"{path}:{line_number}")\n    assert not offenders, "runtime history-sync calls remain: " + ", ".join(offenders)\n''',
              encoding="utf-8",
          )
          changed.append(str(test_path))
          print("changed:", *changed, sep="\n- ")

      - name: Verify targeted regression
        run: python -m pytest -q tests/test_no_runtime_browser_history_sync.py

      - name: Commit fix and remove this one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-remove-history-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard tests .github/workflows/one-shot-remove-history-sync.yml
          git commit -m "Remove runtime browser history sync calls"
          git push origin HEAD:streamlit-cloud-deploy
