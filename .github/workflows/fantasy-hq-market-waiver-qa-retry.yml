name: Fantasy HQ Market Waiver QA Retry

on:
  push:
    branches:
      - fantasy-hq-market-ranked-waivers

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed Python surface
        run: |
          python -m py_compile src/fantasy/market_waivers.py
          python -m py_compile dashboard/pages/11_Fantasy_HQ.py
      - name: Run Fantasy HQ waiver and market regression tests
        run: |
          python -m pytest -q \
            tests/test_fantasy_market_waivers.py \
            tests/test_fantasy_market_start_sit.py \
            tests/test_fantasy_market_fantasy.py \
            tests/test_fantasy_waiver_fit.py \
            tests/test_fantasy_waiver_watch.py
