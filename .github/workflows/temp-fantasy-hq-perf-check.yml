name: Temporary Fantasy HQ Performance Check

on:
  push:
    paths:
      - ".github/workflows/temp-fantasy-hq-perf-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/fantasy-hq-fast

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Fantasy HQ
        run: python -m py_compile dashboard/pages/11_Fantasy_HQ.py

      - name: Run focused Fantasy HQ tests
        run: |
          pytest -q             tests/test_fantasy_action_center.py             tests/test_fantasy_action_feed.py             tests/test_fantasy_canary.py             tests/test_fantasy_catalog.py             tests/test_fantasy_exposure.py             tests/test_fantasy_faab_advisor.py             tests/test_fantasy_free_agents.py             tests/test_fantasy_league_activity.py             tests/test_fantasy_league_needs.py             tests/test_fantasy_lineup_check.py             tests/test_fantasy_market_start_sit.py             tests/test_fantasy_market_trade.py             tests/test_fantasy_market_waivers.py             tests/test_fantasy_opponent_scout.py             tests/test_fantasy_player_intelligence.py             tests/test_fantasy_player_market.py             tests/test_fantasy_roster_health.py             tests/test_fantasy_search_performance.py             tests/test_fantasy_sleeper.py             tests/test_fantasy_team_explorer.py             tests/test_fantasy_trade_candidates.py             tests/test_fantasy_waiver_fit.py             tests/test_fantasy_waiver_watch.py
