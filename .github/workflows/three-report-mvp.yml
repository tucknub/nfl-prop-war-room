name: Three Report MVP

on:
  push:
    branches:
      - propwar-three-report-launch-mvp
  pull_request:
    paths:
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/three-report-mvp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application
        run: python -m compileall -q dashboard src tests

      - name: Run repository tests
        run: pytest -q
