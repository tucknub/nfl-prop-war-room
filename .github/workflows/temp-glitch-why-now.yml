name: Glitch Radar WHY NOW validation

on:
  push:
    paths:
      - ".github/workflows/temp-glitch-why-now.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed modules
        run: |
          python -m py_compile dashboard/glitch_radar_history.py
          python -m py_compile dashboard/glitch_radar_action.py
          python -m py_compile dashboard/pages/09_Glitch_Radar.py
      - name: Run Glitch Radar tests
        run: |
          pytest -q             tests/test_glitch_radar_why_now.py             tests/test_glitch_radar_books.py             tests/test_glitch_radar_coverage.py             tests/test_glitch_radar_enrich.py             tests/test_glitch_radar_grouping.py             tests/test_glitch_radar_line_shop.py             tests/test_glitch_radar_near_miss.py             tests/test_glitch_radar_present.py             tests/test_glitch_radar_props.py             tests/test_glitch_radar_props_feed.py             tests/test_glitch_radar_stale.py
