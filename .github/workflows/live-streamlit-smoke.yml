name: PropWar Live Streamlit Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - PropWar Product Gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: propwar-live-streamlit-smoke-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'streamlit-cloud-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamlit-cloud-deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Allow Streamlit deployment propagation
        if: github.event_name == 'workflow_run'
        run: sleep 30

      - name: Verify deployed PropWar public and auth-safe surfaces
        env:
          PROPWAR_LIVE_URL: https://propwar.streamlit.app
          PROPWAR_LIVE_QA_DIR: /tmp/propwar-live-qa
        run: python scripts/validate_live_streamlit.py

      - name: Upload live QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propwar-live-streamlit-qa
          path: /tmp/propwar-live-qa
          if-no-files-found: warn
