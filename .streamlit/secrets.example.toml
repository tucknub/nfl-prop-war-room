# Example only. Never commit real credentials to this repository.
# Configure these values in Streamlit Community Cloud -> App settings -> Secrets.

PROPWAR_OWNER_EMAIL = "your-google-account@example.com"
MARGIN_GITHUB_TOKEN = "fine-grained-token-with-contents-read-write-on-private-state-repo"
MARGIN_GITHUB_REPO = "your-github-user/propwar-private-state"
MARGIN_GITHUB_BRANCH = "main"
MARGIN_STATE_PATH = "margin/live_state_2026.json"

[auth]
redirect_uri = "https://propwar.streamlit.app/oauth2callback"
cookie_secret = "generate-a-long-random-secret"
client_id = "google-oauth-client-id.apps.googleusercontent.com"
client_secret = "google-oauth-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
