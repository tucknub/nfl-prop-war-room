<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Free Bets">
<title>Free Bet Tracker</title>
<style>
:root{--bg:#f4f2f7;--surface:#fff;--ink:#17151b;--muted:#77727f;--line:#e7e2eb;--purple:#7358bd;--purple2:#9b82df;--red:#f8dedc;--redInk:#942f2b;--orange:#fff0dc;--orangeInk:#8a591e;--shadow:0 12px 30px rgba(41,31,55,.09)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100svh}.app{max-width:590px;margin:auto;padding:12px 14px calc(34px + env(safe-area-inset-bottom))}.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;background:radial-gradient(circle at 86% 18%,rgba(150,118,221,.34),transparent 28%),linear-gradient(145deg,#17111f 0%,#2a2038 54%,#5a438c 125%);box-shadow:0 18px 48px rgba(47,34,67,.24)}.hero:before{content:"";position:absolute;width:230px;height:230px;right:-80px;bottom:-130px;border-radius:999px;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 28px rgba(255,255,255,.025),0 0 0 58px rgba(255,255,255,.018)}.top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#cdbef5}.top h1{font-size:29px;line-height:.98;margin:6px 0 0;font-weight:950;letter-spacing:-.05em}.top p{margin:9px 0 0;color:#d8d1e1;font-size:13px}.refresh{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;width:43px;height:43px;border-radius:14px;font-size:21px;font-weight:900}.logoRail{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.railLogo{height:47px;border-radius:14px;display:grid;place-items:center;padding:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);overflow:hidden}.railLogo.white{background:#fff}.railLogo.black{background:#111}.railLogo.green{background:#07664f}.railLogo img{max-width:100%;max-height:100%;object-fit:contain}.railFallback{display:none;color:#fff;font-weight:950;font-size:12px}.railLogo.white .railFallback{color:#23212a}
.alert{display:none;margin-top:12px;border-radius:20px;padding:13px 14px;background:linear-gradient(135deg,#8f2727,#bc3c34);color:#fff;box-shadow:0 12px 28px rgba(146,43,39,.2)}.alert.show{display:block}.alert.critical{background:linear-gradient(135deg,#6f1616,#a91f1f);animation:pulse 1.6s ease-in-out infinite}.alertTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.alertLabel{font-size:10px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;opacity:.8}.alertTime{font-variant-numeric:tabular-nums;font-size:22px;font-weight:950;letter-spacing:-.03em}.alertPromo{margin-top:3px;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alertBook{font-size:11px;opacity:.8;margin-top:2px}@keyframes pulse{50%{box-shadow:0 12px 34px rgba(169,31,31,.35),0 0 0 3px rgba(169,31,31,.08)}}
.summary{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;margin:14px 0 10px}.stat{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px 14px;box-shadow:0 5px 18px rgba(30,25,38,.04)}.label{font-size:10px;font-weight:900;letter-spacing:.095em;text-transform:uppercase;color:var(--muted)}.num{font-size:29px;font-weight:950;letter-spacing:-.05em;margin-top:6px}.danger .num{color:#a63e36}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin:0 3px 18px;line-height:1.45}.estimate{color:#8b651f}.updated{white-space:nowrap}.updated.stale{color:#99621f;font-weight:800}.updated.old,.offline{color:#a13c30;font-weight:900}.sectionRow{display:flex;align-items:flex-end;justify-content:space-between;margin:0 3px 10px}.section{font-size:16px;font-weight:950;margin:0}.subtle{font-size:11px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:11px}
details.card{--brand:#7358bd;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}details.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}details.card.urgent{border-color:#efb9b3;background:linear-gradient(180deg,#fff 0%,#fff 65%,var(--red) 175%)}details.card.soon{border-color:#efd6b5;background:linear-gradient(180deg,#fff 0%,#fff 67%,var(--orange) 185%)}details.card.finalHour{border-color:#d75750;box-shadow:0 14px 32px rgba(172,55,50,.16)}details.card.critical{border-color:#b51f1f;box-shadow:0 14px 34px rgba(170,32,32,.22)}details.card.first{box-shadow:0 14px 34px rgba(68,45,95,.15);border-color:#cfc1e8}.firstFlag,.hourFlag{position:absolute;top:0;right:0;color:#fff;font-size:9px;font-weight:950;letter-spacing:.09em;text-transform:uppercase;padding:6px 10px 6px 12px;border-radius:0 0 0 12px;z-index:2}.firstFlag{background:linear-gradient(135deg,#7358bd,#9b82df)}.hourFlag{display:none;background:linear-gradient(135deg,#9d2c27,#d04c43)}.finalHour .firstFlag{display:none}.finalHour .hourFlag{display:block}.critical .hourFlag{background:#9f1717}summary{list-style:none;cursor:pointer;padding:16px 15px 14px 18px;outline:none}summary::-webkit-details-marker{display:none}.cardTop{display:flex;gap:12px;align-items:flex-start}.logoTile{width:58px;height:58px;flex:0 0 58px;border-radius:17px;background:#f4f2f6;display:grid;place-items:center;padding:7px;overflow:hidden;border:1px solid rgba(0,0,0,.045)}.logoTile.dark{background:#151518}.logoTile.green{background:#07664f}.logoTile img{max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:14px;font-weight:950;color:var(--brand)}.main{min-width:0;flex:1}.bookline{display:flex;align-items:center;gap:8px}.book{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.065em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heroValue{margin-left:auto;font-size:21px;font-weight:950;white-space:nowrap}.promo{font-size:15px;font-weight:900;margin-top:5px;line-height:1.24}.typeLine{display:flex;align-items:center;gap:7px;margin-top:8px}.typeIcon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#f1ecfb;color:var(--purple);font-size:12px}.tapHint{font-size:11px;color:var(--purple);font-weight:850}.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid rgba(100,100,110,.13);margin-top:13px;padding-top:11px}.count{font-size:15px;font-weight:950;font-variant-numeric:tabular-nums}.finalHour .count{font-size:19px;color:#a92e29;letter-spacing:-.02em}.critical .count{color:#951616}.exact{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badges{display:flex;align-items:center;gap:7px}.pill{font-size:9px;font-weight:950;letter-spacing:.055em;text-transform:uppercase;color:var(--purple);background:#f1ecfb;padding:6px 8px;border-radius:9px}.pill.est{color:#76521f;background:#fff1db;padding:6px 8px;border-radius:9px}.chev{font-size:18px;color:#88828f;transition:transform .16s ease}details[open] .chev{transform:rotate(180deg)}.progress{height:3px;background:#eeeaf1;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width 1s linear}.finalHour .progress span{background:#d54e46}.critical .progress span{background:#a91919}.details{border-top:1px solid rgba(100,100,110,.13);padding:13px 16px 16px 18px;font-size:12px;line-height:1.55;color:#55515e;background:rgba(255,255,255,.62)}.detailLabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:950;margin-bottom:4px}.empty{background:#fff;border:1px dashed #d5d0dc;border-radius:20px;padding:48px 20px;text-align:center;color:var(--muted)}.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.55;margin:20px 24px 0}@media(min-width:700px){.app{padding-top:24px}.top h1{font-size:33px}}
</style>
</head>
<body>
<main class="app">
<section class="hero"><div class="top"><div><div class="eyebrow">Promo wallet</div><h1>Free Bet Tracker</h1><p>Free money first. Urgent promos next.</p></div><button class="refresh" id="refresh" aria-label="Refresh">↻</button></div><div class="logoRail" aria-label="Tracked sportsbooks">
<div class="railLogo"><img src="https://dkstatic.s3.amazonaws.com/Creative-Development/2020/SB/Sportsbook_FC_on_dark.png" alt="DraftKings" onerror="fallbackRail(this)"><span class="railFallback">DK</span></div>
<div class="railLogo white"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/Fanduel_logo.svg" alt="FanDuel" onerror="fallbackRail(this)"><span class="railFallback">FD</span></div>
<div class="railLogo white"><img src="https://s202.q4cdn.com/508919455/files/images/fact-sheets-images/CaesarsSportsbook/6250018-1000x200-Medallia-Property-Logo-Resize-Caesars-Sportsbook-Digital-v2.jpg" alt="Caesars" onerror="fallbackRail(this)"><span class="railFallback">CZR</span></div>
<div class="railLogo black"><img src="https://www.hardrock.bet/wp-content/uploads/2024/03/Hard-Rock-Bet-Logo-White.svg" alt="Hard Rock Bet" onerror="fallbackRail(this)"><span class="railFallback">HR</span></div>
<div class="railLogo green"><img src="https://upload.wikimedia.org/wikipedia/commons/d/dc/Bet365_Logo.svg" alt="bet365" onerror="fallbackRail(this)"><span class="railFallback">365</span></div>
</div></section>
<section class="alert" id="hourAlert"><div class="alertTop"><div><div class="alertLabel" id="alertLabel">Final hour</div><div class="alertPromo" id="alertPromo"></div><div class="alertBook" id="alertBook"></div></div><div class="alertTime" id="alertTime"></div></div></section>
<section class="summary"><div class="stat"><div class="label">Bonus bet money</div><div class="num" id="money">$0</div></div><div class="stat danger"><div class="label">Under 24h</div><div class="num" id="urgent">0</div></div></section>
<div class="meta"><span><span id="active">0 active</span><span id="estimated" class="estimate"></span></span><span id="updated" class="updated">Loading…</span></div>
<div class="sectionRow"><h2 class="section">Expiring next</h2><span class="subtle">Live countdowns</span></div>
<section class="list" id="list"></section>
<p class="note">Countdowns update every second while this page is open. Tap a promo for terms.</p>
</main>
<script>
const DATA_URL='https://raw.githubusercontent.com/tucknub/nfl-prop-war-room/streamlit-cloud-deploy/free-bet-tracker/promos.json';
const LOGOS={'DraftKings':{url:'https://dkstatic.s3.amazonaws.com/Creative-Development/2020/SB/Sportsbook_FC_on_dark.png',cls:'dark',brand:'#62b715'},'FanDuel':{url:'https://upload.wikimedia.org/wikipedia/commons/b/b5/Fanduel_logo.svg',cls:'',brand:'#1676d2'},'Caesars':{url:'https://s202.q4cdn.com/508919455/files/images/fact-sheets-images/CaesarsSportsbook/6250018-1000x200-Medallia-Property-Logo-Resize-Caesars-Sportsbook-Digital-v2.jpg',cls:'',brand:'#9b773f'},'Hard Rock Bet':{url:'https://www.hardrock.bet/wp-content/uploads/2024/03/Hard-Rock-Bet-Logo-White.svg',cls:'dark',brand:'#d3ae33'},'bet365':{url:'https://upload.wikimedia.org/wikipedia/commons/d/dc/Bet365_Logo.svg',cls:'green',brand:'#0b8c67'}};
const ICONS={bonus:'◆',boost:'↗',no_sweat:'✓',qualifier:'+'};const $=s=>document.querySelector(s),list=$('#list');let promos=[],dataUpdatedAt=null;
function fallbackRail(img){img.style.display='none';img.nextElementSibling.style.display='block'}function msLeft(x){return new Date(x).getTime()-Date.now()}function hrs(x){return msLeft(x)/36e5}function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0)}function exact(x){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x))}function updatedText(x){return 'Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x)).replace(',',' ·')}function initials(s){return s.split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function hero(p){if(p.value>0)return money(p.value);const m=p.promo.match(/\b\d+%/);if(m)return m[0];if(p.kind==='no_sweat')return'No Sweat';if(p.kind==='qualifier')return'Earn $10';return'Promo'}function kind(p){return p.kind==='bonus'?'Bonus Bet':p.kind==='no_sweat'?'No Sweat':p.kind==='qualifier'?'Bet & Get':'Boost'}function cls(h){return h<24?'urgent':h<48?'soon':''}function countdown(ms){if(ms<=0)return'Expired';const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h<1)return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(h<24)return`${h}h ${String(m).padStart(2,'0')}m`;const d=Math.floor(h/24);return`${d}d ${h%24}h`}function freshness(){const el=$('#updated');if(!dataUpdatedAt)return;const age=(Date.now()-new Date(dataUpdatedAt).getTime())/36e5;el.className='updated';if(age>=24)el.classList.add('old');else if(age>=12)el.classList.add('stale');el.textContent=updatedText(dataUpdatedAt)}function logoTile(book){const l=LOGOS[book];if(!l)return`<div class="logoTile"><span class="fallback">${initials(book)}</span></div>`;return`<div class="logoTile ${l.cls}"><img src="${l.url}" alt="${esc(book)} logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${initials(book)}</span></div>`}function progress(h){if(h<=0)return 0;if(h>=48)return 100;return Math.max(3,Math.round(h/48*100))}
function render(){const openIds=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.id));const active=promos.filter(p=>msLeft(p.expires)>0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));$('#money').textContent=money(active.filter(p=>p.kind==='bonus').reduce((s,p)=>s+Number(p.value||0),0));$('#urgent').textContent=active.filter(p=>hrs(p.expires)<24).length;$('#active').textContent=active.length+' active';const est=active.filter(p=>p.estimated).length;$('#estimated').textContent=est?' · '+est+' estimated'+(est===1?'':'')+' expirations':'';if(!active.length){list.innerHTML='<div class="empty"><strong>Nothing waiting</strong>No active promos are currently tracked.</div>';tick();freshness();return}list.innerHTML=active.map((p,i)=>{const h=hrs(p.expires),l=LOGOS[p.book]||{brand:'#7358bd'},isOpen=openIds.has(p.id)?' open':'';return`<details class="card ${cls(h)} ${i===0?'first':''}" data-id="${esc(p.id)}" data-expiry="${esc(p.expires)}" style="--brand:${l.brand}"${isOpen}><span class="firstFlag">Use first</span><span class="hourFlag">Final hour</span><summary><div class="cardTop">${logoTile(p.book)}<div class="main"><div class="bookline"><div class="book">${esc(p.book)}</div><div class="heroValue">${esc(hero(p))}</div></div><div class="promo">${esc(p.promo)}</div><div class="typeLine"><span class="typeIcon">${ICONS[p.kind]||'•'}</span><span class="tapHint">Tap for terms</span></div></div></div><div class="foot"><div><span class="count" data-countdown></span><span class="exact">Expires ${exact(p.expires)}</span></div><span class="badges"><span class="pill ${p.estimated?'est':''}">${p.estimated?'Est.':kind(p)}</span><span class="chev">⌄</span></span></div></summary><div class="progress"><span style="width:${progress(h)}%"></span></div><div class="details"><div class="detailLabel">Terms / notes</div><div>${esc(p.notes||'No extra terms captured.')}</div></div></details>`}).join('');tick();freshness()}
function tick(){let expired=false;document.querySelectorAll('details.card[data-expiry]').forEach(card=>{const ms=msLeft(card.dataset.expiry);if(ms<=0){expired=true;return}const mins=ms/60000;card.classList.toggle('finalHour',mins<60);card.classList.toggle('critical',mins<15);const c=card.querySelector('[data-countdown]');if(c)c.textContent=countdown(ms);const bar=card.querySelector('.progress span');if(bar)bar.style.width=(mins<60?Math.max(1,Math.min(100,mins/60*100)):progress(ms/36e5))+'%'});const active=promos.filter(p=>msLeft(p.expires)>0).sort((a,b)=>new Date(a.expires)-new Date(b.expires));const next=active[0],alert=$('#hourAlert');if(next&&msLeft(next.expires)<36e5){const ms=msLeft(next.expires),critical=ms<15*60000;alert.classList.add('show');alert.classList.toggle('critical',critical);$('#alertLabel').textContent=critical?'Critical · under 15 minutes':'Final hour';$('#alertPromo').textContent=next.promo;$('#alertBook').textContent=next.book;$('#alertTime').textContent=countdown(ms);document.title=`${critical?'⚠ ':''}${countdown(ms)} · Free Bet Tracker`}else{alert.classList.remove('show','critical');document.title='Free Bet Tracker'}if(expired)render()}
async function load(){try{const r=await fetch(DATA_URL+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();promos=Array.isArray(d.promos)?d.promos:[];dataUpdatedAt=d.updatedAt||null;render()}catch{$('#updated').textContent='Refresh failed';$('#updated').className='updated offline'}}
$('#refresh').onclick=load;load();setInterval(tick,1000);setInterval(load,60000);
</script>
</body></html>
