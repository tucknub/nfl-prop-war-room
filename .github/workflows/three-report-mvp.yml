name: Three Report MVP

on:
  push:
    branches:
      - propwar-three-report-launch-mvp
  pull_request:
    paths:
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/three-report-mvp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application
        run: python -m compileall -q dashboard src tests

      - name: Run repository tests
        id: repository_tests
        continue-on-error: true
        run: pytest -q > pytest.log 2>&1

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-report-pytest-log
          path: pytest.log
          if-no-files-found: error

      - name: Package branch for browser QA
        if: steps.repository_tests.outcome == 'success'
        run: |
          zip -qr three-report-branch-source.zip . \
            -x '.git/*' \
            -x 'three-report-branch-source.zip'

      - name: Upload branch source
        if: steps.repository_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: three-report-branch-source
          path: three-report-branch-source.zip
          if-no-files-found: error

      - name: Enforce test result
        if: steps.repository_tests.outcome == 'failure'
        run: |
          tail -n 200 pytest.log
          exit 1
