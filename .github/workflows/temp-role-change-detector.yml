name: Role Change Detector validation
# rerun with production-equivalent dashboard import path

on:
  push:
    paths:
      - ".github/workflows/temp-role-change-detector.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed modules
        run: |
          python -m py_compile dashboard/role_change.py
          python -m py_compile dashboard/pages/01_Teams.py
          python -m py_compile dashboard/pages/02_Players.py
      - name: Detector and canonical role tests
        run: |
          pytest -q             tests/test_role_change_detector.py             tests/test_role_research.py             tests/test_public_role_research_language.py
      - name: Calibrate detector on 2025 archive
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd

          root = Path.cwd()
          sys.path.insert(0, str(root / "dashboard"))
          sys.path.insert(0, str(root))

          from research_data import ROLE_LABELS, primary_rows, team_window_summary
          from role_change import build_team_role_change_table

          season = 2025
          end_week = 18
          data = primary_rows()
          teams = sorted(
              data.loc[data["season"].eq(season), "team"]
              .dropna().astype(str).unique().tolist()
          )
          frames = []
          for team in teams:
              for family in ROLE_LABELS:
                  table = build_team_role_change_table(
                      role_family=family,
                      last8=team_window_summary(season, team, family, end_week, 8, "Normal game"),
                      last4=team_window_summary(season, team, family, end_week, 4, "Normal game"),
                      last2=team_window_summary(season, team, family, end_week, 2, "Normal game"),
                  )
                  if table.empty:
                      continue
                  frames.append(table.assign(team=team))

          audit = pd.concat(frames, ignore_index=True)
          for column in ("last8_share", "last4_share", "last2_share"):
              values = pd.to_numeric(audit[column], errors="coerce").dropna()
              assert values.between(0, 1).all(), column

          strong = audit[audit["classification"].isin(["ROLE SURGE", "ROLE DROP"])]
          assert strong["confidence"].eq("HIGH").all()

          print("CLASS_COUNTS")
          print(audit["classification"].value_counts().to_string())
          print("CONFIDENCE_COUNTS")
          print(audit["confidence"].value_counts().to_string())
          print("STRONG_BY_FAMILY")
          print(strong.groupby(["role_family", "classification"]).size().to_string())
          print("TOP_ABSOLUTE_SHIFTS")
          columns = [
              "team", "player_name", "position", "role_family",
              "classification", "confidence", "last8_share",
              "last4_share", "last2_share", "shift_pp",
          ]
          print(
              audit.sort_values("abs_shift", ascending=False)[columns]
              .head(20).to_string(index=False)
          )
          PY

      - name: Streamlit startup smoke tests
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          sys.path.insert(0, str(root / "dashboard"))
          sys.path.insert(0, str(root))

          for path in (
              "dashboard/pages/01_Teams.py",
              "dashboard/pages/02_Players.py",
          ):
              at = AppTest.from_file(path)
              at.run(timeout=45)
              if at.exception:
                  print(path)
                  for exc in at.exception:
                      print(exc.value)
                  raise SystemExit(1)
              print(path, "startup ok")
          PY
