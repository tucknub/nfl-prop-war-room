name: Margin Research V1

on:
  push:
    branches: [margin-research-v1]
    paths:
      - 'research/margin_v1/run_margin_team_style.py'
  pull_request:
    branches: [streamlit-cloud-deploy]
    paths:
      - 'research/margin_v1/run_margin_team_style.py'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn nflreadpy
      - name: Run team-style residual research
        run: python research/margin_v1/run_margin_team_style.py
