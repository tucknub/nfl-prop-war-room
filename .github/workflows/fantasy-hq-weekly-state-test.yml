name: Fantasy HQ Weekly State Test

on:
  pull_request:
    paths:
      - "src/fantasy/**"
      - "tests/test_fantasy_sleeper_weekly.py"
      - ".github/workflows/fantasy-hq-weekly-state-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'httpx>=0.27,<1.0'
      - name: Run fantasy adapter tests
        run: pytest -q tests/test_fantasy_sleeper.py tests/test_fantasy_sleeper_weekly.py
      - name: Verify live completed and pre-draft Sleeper state
        run: |
          python - <<'PY'
          from src.fantasy.sleeper import SleeperClient, normalize_sleeper_bundle

          COMPLETED = {
              "ffl_2025": ("1242463021108838400", 10),
              "papa_2025": ("1237498478561603584", 12),
          }
          CURRENT = {
              "ffl_2026": "1383849993151987712",
              "papa_2026": "1356381517693079553",
          }

          with SleeperClient() as client:
              for label, (league_id, team_count) in COMPLETED.items():
                  bundle = client.fetch_league_bundle(league_id)
                  state = normalize_sleeper_bundle(bundle)
                  assert state.team_count == team_count, (label, state.team_count)
                  assert state.draft and state.draft.platform_draft_id, label
                  assert state.draft.status == "complete", (label, state.draft.status)

                  weekly = client.fetch_weekly_state(league_id, 1)
                  assert len(weekly.matchups) == team_count, (label, len(weekly.matchups))
                  assert len({row.platform_roster_id for row in weekly.matchups}) == team_count, label
                  assert all(row.week == 1 for row in weekly.matchups), label
                  assert any(row.points is not None for row in weekly.matchups), label
                  assert all(tx.platform_transaction_id for tx in weekly.transactions), label

                  picks = client.fetch_draft_picks(state.draft.platform_draft_id)
                  assert picks, f"{label}: completed draft returned no picks"
                  assert all(pick.platform_draft_id == state.draft.platform_draft_id for pick in picks), label
                  assert all(pick.platform_player_id for pick in picks), label

              for label, league_id in CURRENT.items():
                  bundle = client.fetch_league_bundle(league_id)
                  state = normalize_sleeper_bundle(bundle)
                  assert state.status == "pre_draft", (label, state.status)
                  assert state.draft and state.draft.platform_draft_id, label

                  weekly = client.fetch_weekly_state(league_id, 1)
                  valid_rosters = {roster.platform_roster_id for roster in state.rosters}
                  assert all(row.platform_roster_id in valid_rosters for row in weekly.matchups), label
                  assert all(tx.platform_transaction_id for tx in weekly.transactions), label

                  picks = client.fetch_draft_picks(state.draft.platform_draft_id)
                  assert all(pick.platform_draft_id == state.draft.platform_draft_id for pick in picks), label

          print("live weekly-state acceptance passed")
          PY
